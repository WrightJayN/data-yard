<style>
:root{
  --bg:#0f1a2b; --bg2:#16263d; --card:#1c3050; --card2:#233a5e; --line:#2e4a73;
  --ink:#eef4ff; --mute:#9db1cf; --gold:#ffc83d; --green:#2bd67b; --red:#ff5c6c;
  --blue:#4fa3ff; --teal:#22c3b5; --pink:#ff7ac6; --orange:#ff9a3c; --violet:#a98bff;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,#1f3d66 0%,var(--bg) 60%)}
#app{max-width:720px;margin:0 auto;padding:14px 14px 120px}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;margin:0;letter-spacing:.2px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .back{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:20px;display:grid;place-items:center;flex:none}
.top .ttl{flex:1;min-width:0}
.top .ttl h2{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{color:var(--mute);font-weight:700;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:6px 11px;font-weight:800;font-size:14px;flex:none}
.hero{background:linear-gradient(135deg,#2a5298,#1e3c72 60%,#13284d);border-radius:22px;padding:18px;margin-bottom:16px;position:relative;overflow:hidden;border:1px solid #3b63a5}
.hero h1{font-size:28px;line-height:1.1}
.hero p{color:#cfe0ff;margin:6px 0 12px;font-size:14.5px}
.hero .deco{position:absolute;right:-8px;top:-6px;font-size:84px;opacity:.18;transform:rotate(12deg)}
.lvl{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:12px;background:#0d1b30;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff8a3c);border-radius:99px;transition:width .5s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.world{border-radius:20px;padding:15px;text-align:left;position:relative;overflow:hidden;min-height:132px;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.12);transition:transform .12s}
.world:active{transform:scale(.98)}
.world .ico{font-size:34px;line-height:1}
.world h3{font-size:18px;margin-top:8px}
.world p{margin:3px 0 0;font-size:13px;opacity:.88;flex:1}
.world .prog{margin-top:10px;font-weight:800;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.world .mini{height:7px;background:rgba(0,0,0,.25);border-radius:9px;overflow:hidden;margin-top:6px}
.world .mini i{display:block;height:100%;background:#fff;opacity:.9}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--blue);color:#fff;font-weight:800;padding:13px 18px;border-radius:14px;box-shadow:0 4px 0 #2a6fc0;font-size:16px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2a6fc0}

.btn.y{background:var(--gold);box-shadow:0 4px 0 #c99400;color:#3a2a00}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45}
.wide{width:100%}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}

pre{background:#0b1626;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.5;color:#cfe6ff;margin:8px 0;white-space:pre}

.opt.right{border-color:var(--green);background:#14452f}

.sheet p{margin:6px 0 14px;line-height:1.5;font-size:15px;color:#e8f0ff}
.hintBox{background:#2b2a12;border:1px solid #6d6420;color:#ffeaa0;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14.5px;line-height:1.45}
.fig{background:#f6f9ff;border-radius:14px;padding:8px;margin-top:12px}
.fig svg{display:block;width:100%;height:auto}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--gold);color:#3a2a00;font-weight:800;padding:10px 18px;border-radius:99px;z-index:20;transition:transform .3s;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.toast.show{transform:translateX(-50%) translateY(0)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border-radius:12px;background:var(--card);font-weight:800;border:1.5px solid var(--line)}
.tabs button.on{background:var(--blue);border-color:var(--blue)}
details{margin-top:10px}
summary{cursor:pointer;font-weight:800;color:var(--teal);font-size:14px}
.big{font-size:56px;text-align:center;margin:10px 0}
.center{text-align:center}
.muted{color:var(--mute)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.7}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.loading{padding:40px;text-align:center;color:var(--mute)}
u{text-decoration-thickness:2px;text-underline-offset:3px}
</style>

/* ER crow's-foot figure helper. ends: one | zeroOne | many | zeroMany */
function crowSym(type){
  // drawn for the RIGHT end (entity edge at x=290), line arrives from left
  const y=45; let s='';
  if(type==='many'||type==='zeroMany'){ s+=`<path d="M272 ${y} L290 ${y-11} M272 ${y} L290 ${y} M272 ${y} L290 ${y+11}" stroke="#1c2b45" stroke-width="2.2" fill="none"/>`; }
  if(type==='one'){ s+=`<path d="M281 ${y-10} V${y+10} M273 ${y-10} V${y+10}" stroke="#1c2b45" stroke-width="2.2"/>`; }
  if(type==='zeroOne'){ s+=`<path d="M281 ${y-10} V${y+10}" stroke="#1c2b45" stroke-width="2.2"/><circle cx="268" cy="${y}" r="6" fill="#fff" stroke="#1c2b45" stroke-width="2.2"/>`; }
  if(type==='many'){ s+=`<path d="M266 ${y-10} V${y+10}" stroke="#1c2b45" stroke-width="2.2"/>`; }
  if(type==='zeroMany'){ s+=`<circle cx="262" cy="${y}" r="6" fill="#fff" stroke="#1c2b45" stroke-width="2.2"/>`; }
  return s;
}
function crow(a,b,rel,leftEnd,rightEnd){
  return `<svg viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg" font-family="Nunito,sans-serif">
  <rect x="8" y="25" width="102" height="40" rx="6" fill="#dbe9ff" stroke="#1c2b45" stroke-width="2"/>
  <rect x="290" y="25" width="102" height="40" rx="6" fill="#dbe9ff" stroke="#1c2b45" stroke-width="2"/>
  <text x="59" y="50" text-anchor="middle" font-weight="800" font-size="13" fill="#1c2b45">${a}</text>
  <text x="341" y="50" text-anchor="middle" font-weight="800" font-size="13" fill="#1c2b45">${b}</text>
  <line x1="110" y1="45" x2="290" y2="45" stroke="#1c2b45" stroke-width="2.2"/>
  <text x="200" y="36" text-anchor="middle" font-style="italic" font-size="13" fill="#1c2b45">${rel}</text>
  ${crowSym(rightEnd)}
  <g transform="translate(400,0) scale(-1,1)">${crowSym(leftEnd)}</g>
  </svg>`;
}

  ['What is an ER model?', `<p>An <b>Entity-Relationship (ER) model</b> is a picture of the data a business needs, drawn <i>before</i> you build any tables. It lives at the <b>conceptual level</b> of the ANSI/SPARC architecture.</p>
   <ul><li><b>Entity</b>: a thing you store data about (noun). <code>STUDENT</code>, <code>COURSE</code></li>
   <li><b>Attribute</b>: a property of an entity. <code>StudentID</code>, <code>Name</code></li>
   <li><b>Relationship</b>: how entities connect (verb). STUDENT <i>enrols in</i> COURSE</li></ul>
   <p><b>Trick:</b> in a case study, <b>nouns</b> become entities or attributes, and <b>verbs</b> become relationships.</p>`],
  ['Cardinality (how many?)', `<ul><li><b>1:1</b> one to one. A lecturer <i>heads</i> one department.</li>
   <li><b>1:M</b> one to many. A department <i>employs</i> many lecturers.</li>
   <li><b>M:N</b> many to many. Students <i>enrol in</i> many courses, and courses have many students.</li></ul>
   <p>Ask the question both ways: "One A has how many B?" then "One B has how many A?"</p>`],

  {type:'mcq', q:'What does this crow’s foot diagram say?', fig:crow('LECTURER','DEPARTMENT','heads','one','zeroOne'),

   why:'Read the symbol at the far end. A lecturer heads <b>o|</b> (zero or one) department, the symbol beside DEPARTMENT. A department is headed by <b>||</b> (exactly one) lecturer, the symbol beside LECTURER. This is an optional 1:1.'},
  {type:'mcq', q:'Which attribute is the BEST primary key for a STUDENT entity?', opts:['Full name','Date of birth','StudentID','Phone number'], a:2,

  {type:'sort', q:'Classify each EMPLOYEE attribute.', cats:['Simple','Composite','Multivalued','Derived'],
   items:[['TRN',0],['Address (street, town, parish)',1],['Phone numbers',2],['Age (from DOB)',3],['Full name (first, last)',1],['Years employed',3]],
   hint:'Derived = calculated. Multivalued = could hold several values. Composite = made of sub-parts.',

  {type:'mcq', q:'A DEPENDENT (an employee’s child) is identified only by name together with the employee’s ID. DEPENDENT is a…', opts:['Strong entity','Weak entity','Derived attribute','Associative entity'], a:1,
   why:'A weak entity cannot be uniquely identified by its own attributes. It depends on its owner (EMPLOYEE) through an identifying relationship.'},
  {type:'mcq', q:'An EMPLOYEE supervises other EMPLOYEES. What kind of relationship is this?', opts:['Binary','Ternary','Unary (recursive)','Generalization'], a:2,
   why:'The entity relates to itself, so it is unary, also called recursive.'},
  {type:'mcq', q:'PERSON holds id, name and phone. STUDENT and LECTURER each add their own attributes. PERSON is the…', opts:['Weak entity','Superclass (generalization)','Associative entity','Subclass'], a:1,
   why:'PERSON is the superclass. STUDENT and LECTURER are subclasses that inherit its attributes. This is generalization/specialization.'},
  {type:'mcq', q:'“Every order MUST be placed by a customer.” On the ORDER side, this participation is…', opts:['Optional (partial)','Mandatory (total)','Recursive','Derived'], a:1,
   why:'MUST means total, or mandatory, participation. In crow’s foot it is shown with a bar (|), not a circle (o).'},
  {type:'mcq', q:'In the ANSI/SPARC architecture, where does the ER model (the whole logical design) live?', opts:['External level','Conceptual level','Internal level','Physical file level'], a:1,
   why:'The conceptual level describes the whole database logically. External = individual user views. Internal = how the data is physically stored.'},
  {type:'mcq', q:'Which is a DISADVANTAGE of the traditional file system compared to a DBMS?', opts:['Centralized control','Data redundancy and inconsistency','Concurrent access control','Enforced integrity constraints'], a:1,

 ]},
{ id:'rel', name:'Relation Ridge', ico:'📐', color:'linear-gradient(135deg,#7b5cff,#4b2fb3)', blurb:'Relational notation, keys, integrity, normalization, algebra', unit:'Units 4–5',
 lessons:[
  ['Relational notation', `<p>Write each table as <b>NAME(attributes)</b>. <u>Underline</u> the primary key and mark foreign keys with <b>*</b> (or <i>italics</i>, depending on your lecturer).</p>
   <pre>STUDENT(<u>StudentID</u>, FName, LName, Major)
COURSE(<u>CourseCode</u>, Title, Credits)
ENROLMENT(<u>StudentID*</u>, <u>CourseCode*</u>, Grade)</pre>`],
  ['ER → Relations: the 3 rules', `<ul><li><b>Entity</b> → its own relation, with its key underlined.</li>
   <li><b>1:M</b> → put the PK of the "1" side as an <b>FK in the "M" side</b>.<br><code>LECTURER(<u>LecID</u>, Name, DeptID*)</code></li>
   <li><b>M:N</b> → make a <b>new junction relation</b> whose PK combines both FKs.<br><code>ENROLMENT(<u>StudentID*</u>, <u>CourseCode*</u>, Grade)</code></li>
   <li><b>1:1</b> → put the FK on either side (prefer the side with total participation).</li></ul>`],
  ['Vocabulary', `<ul><li><b>Relation</b> = table · <b>Tuple</b> = row · <b>Attribute</b> = column</li>
   <li><b>Domain</b> = the allowed values for an attribute</li>
   <li><b>Degree</b> = number of attributes · <b>Cardinality</b> = number of tuples</li>
   <li><b>Entity integrity</b>: a PK can never be NULL.</li>
   <li><b>Referential integrity</b>: an FK must match an existing PK, or be NULL.</li></ul>`],
  ['Functional dependency & normal forms', `<p><code>A → B</code> means "if you know A, you know B" (StudentID → Name).</p>
   <ul><li><b>1NF</b>: atomic values and no repeating groups.</li>
   <li><b>2NF</b>: 1NF plus no <b>partial</b> dependency (a non-key column depending on <i>part</i> of a composite key).</li>
   <li><b>3NF</b>: 2NF plus no <b>transitive</b> dependency (non-key → non-key).</li>
   <li><b>BCNF</b>: every determinant is a candidate key.</li>
   <li><b>4NF</b>: BCNF plus no independent <b>multi-valued</b> dependencies.</li></ul>
   <p>Memory line: "The key, the whole key, and nothing but the key."</p>`],
  ['Relational algebra cheat sheet', `<ul><li><b>σ</b> select: filter <i>rows</i>. <code>σ Major='CS' (STUDENT)</code></li>
   <li><b>π</b> project: pick <i>columns</i>. <code>π Name (STUDENT)</code></li>
   <li><b>⋈</b> join: combine on matching values</li>
   <li><b>∪ ∩ −</b> union, intersection, difference (tables must be union-compatible)</li>
   <li><b>×</b> Cartesian product · <b>÷</b> division ("for ALL")</li></ul>
   <p>Work inside out: <code>π Name (σ GPA&gt;3.5 (STUDENT))</code> means filter first, then pick columns.</p>
   <p><b>Relational calculus</b> says <i>what</i> you want: <code>{ t.Name | STUDENT(t) ∧ t.GPA &gt; 3.5 }</code>. ∃ means "there exists" and ∀ means "for all".</p>`]
 ],
 ch:[
  {type:'mcq', q:'Which is correct relational notation for STUDENT with key StudentID?', opts:['STUDENT(StudentID, <u>Name</u>, Major)','<u>STUDENT</u>(StudentID, Name, Major)','STUDENT(<u>StudentID</u>, Name, Major)','STUDENT = StudentID + Name + Major'], a:2, html:true,
   why:'The relation name comes first, then the attributes in brackets, with the primary key underlined.'},
  {type:'mcq', q:'DEPARTMENT 1 ──< many LECTURER. Which mapping is correct?', html:true,
   opts:['DEPARTMENT(<u>DeptID</u>, Name, LecID*)','LECTURER(<u>LecID</u>, Name, DeptID*)','DEPT_LEC(<u>DeptID*</u>, <u>LecID*</u>)','LECTURER(<u>LecID</u>, <u>DeptID</u>, Name)'], a:1,
   hint:'The foreign key goes on the MANY side.', why:'For 1:M, copy the PK of the "one" side (DeptID) into the "many" side (LECTURER) as a foreign key.'},
  {type:'mcq', q:'STUDENT M:N COURSE, and the grade is stored per enrolment. Best mapping?', html:true,
   opts:['STUDENT(<u>StudentID</u>, Name, CourseCode*, Grade)','COURSE(<u>Code</u>, Title, StudentID*)','ENROLMENT(<u>StudentID*</u>, <u>CourseCode*</u>, Grade)','ENROLMENT(<u>Grade</u>, StudentID, CourseCode)'], a:2,
   why:'An M:N needs a junction relation. Its PK is the combination of both FKs, and the grade belongs to the pairing, so it goes there too.'},
  {type:'sort', q:'Match each term to its meaning.', cats:['Row','Column','Table','# of columns','# of rows','Allowed values'],
   items:[['Tuple',0],['Attribute',1],['Relation',2],['Degree',3],['Cardinality',4],['Domain',5]],
   why:'Tuple = row, Attribute = column, Relation = table, Degree = number of columns, Cardinality = number of rows, Domain = the set of allowed values.'},
  {type:'mcq', q:'Inserting a STUDENT row with StudentID = NULL is rejected. Which rule was broken?', opts:['Referential integrity','Entity integrity','Domain integrity','2NF'], a:1,
   why:'Entity integrity says no part of a primary key may be NULL.'},
  {type:'mcq', q:'ENROLMENT has StudentID = 99, but there is no student 99. Which rule is broken?', opts:['Entity integrity','Referential integrity','1NF','Transitive dependency'], a:1,
   why:'Referential integrity says a foreign key must match an existing primary key (or be NULL).'},
  {type:'mcq', q:'Table: ENROLMENT(<u>StudentID</u>, <u>CourseCode</u>, StudentName, Grade). Which dependency breaks 2NF?', html:true,
   opts:['StudentID, CourseCode → Grade','StudentID → StudentName','CourseCode → CourseCode','Grade → StudentID'], a:1,
   hint:'2NF is about depending on only PART of a composite key.', why:'StudentName depends on only part of the key (StudentID). That is a partial dependency, so the table is not in 2NF. Move StudentName into STUDENT.'},
  {type:'mcq', q:'STUDENT(<u>StudentID</u>, Name, DeptID, DeptName). DeptID → DeptName. This table violates…', html:true,
   opts:['1NF','2NF','3NF (transitive dependency)','Entity integrity'], a:2,
   why:'StudentID → DeptID → DeptName means a non-key column depends on another non-key column. That transitive dependency breaks 3NF. Split it out into DEPARTMENT(<u>DeptID</u>, DeptName).'},
  {type:'mcq', q:'A STUDENT table has columns Phone1, Phone2, Phone3. What is the problem?', opts:['Repeating group, so it is not in 1NF','Transitive dependency','Partial dependency','Nothing is wrong'], a:0,
   why:'Repeating columns are a repeating group, which breaks 1NF. Fix it with STUDENT_PHONE(<u>StudentID*</u>, <u>Phone</u>).'},
  {type:'mcq', q:'The department name is stored in every student row. Renaming the department means editing 500 rows, and some get missed. This is a(n)…', opts:['Insertion anomaly','Update anomaly','Deletion anomaly','Referential integrity'], a:1,
   why:'Redundant data must be changed in many places, which causes inconsistency. That is an update anomaly, and normalization prevents it.'},
  {type:'mcq', q:'LECTURER(<u>LecID</u>, <u>Course</u>, <u>Hobby</u>), where courses and hobbies are independent facts. To fix it, split into…', html:true,
   opts:['LEC_COURSE(<u>LecID</u>, <u>Course</u>) and LEC_HOBBY(<u>LecID</u>, <u>Hobby</u>)','One table with Hobby1, Hobby2','LECTURER(<u>LecID</u>, Course, Hobby)','No change needed'], a:0,
   why:'Two independent multi-valued facts in one table is a multi-valued dependency, which breaks 4NF. Give each fact its own table.'},
  {type:'build', q:'Build the relational algebra: names of students majoring in CS.', sub:'Filter the rows first, then pick the column.',
   tokens:['π Name','σ Major=\'CS\'','(',')','(',')','STUDENT','⋈','σ Name'], answer:['π Name','(','σ Major=\'CS\'','(','STUDENT',')',')'],
   hint:'Outside → inside: π Name ( σ … ( STUDENT ) )', why:'π Name (σ Major=\'CS\' (STUDENT)). σ keeps the CS rows, then π keeps only the Name column.'},
  {type:'mcq', q:'Which operator answers “students who took ALL the courses”?', opts:['∪ Union','× Cartesian product','÷ Division','σ Select'], a:2,
   why:'Division (÷) finds tuples related to every tuple in another relation. It is the "for all" query.'},
  {type:'mcq', q:'R ∪ S only works when R and S are…', opts:['The same size','Union-compatible (same number of attributes with matching domains)','Joined first','In 3NF'], a:1,
   why:'Union, intersection and difference need union-compatible relations: same degree and matching domains.'},
  {type:'mcq', q:'What does this relational calculus return? <code>{ t.Name | STUDENT(t) ∧ t.GPA &gt; 3.5 }</code>', html:true,
   opts:['Every student’s GPA','Names of students with GPA above 3.5','Number of students','Students with GPA at most 3.5'], a:1,
   why:'The target list (t.Name) comes before |. The qualifying statement comes after it: t is a STUDENT and GPA > 3.5.'}
 ]},
{ id:'sql', name:'SQL Lab', ico:'🧪', color:'linear-gradient(135deg,#ff8a3c,#d9480f)', blurb:'Live SQLite: SELECT, JOIN, GROUP BY, INSERT, CREATE…', unit:'Unit 7',
 lessons:[
  ['The lab database', `<p>This SQL runs on a <b>real SQLite engine inside the page</b>. There is nothing to install. Tables:</p>
   <pre>student(id, fname, lname, major, gpa, year, parish)
course(code, title, credits, lecturer)
enrolment(student_id, course_code, grade, score)</pre>
   <p>Tap <b>🗂 Tables</b> in any SQL challenge to peek at the data.</p>`],
  ['SELECT skeleton', `<pre>SELECT columns        -- what
FROM table            -- where from
WHERE condition       -- which rows
GROUP BY column       -- make groups
HAVING group_cond     -- filter groups
ORDER BY column DESC  -- sort
LIMIT n;</pre><p>Memory line: <b>S</b>ome <b>F</b>riendly <b>W</b>orms <b>G</b>et <b>H</b>ungry <b>O</b>ften.</p>`],
  ['Filtering', `<pre>WHERE major = 'CS' AND gpa >= 3.5
WHERE lname LIKE 'W%'      -- starts with W
WHERE major IN ('IT','SE')
WHERE gpa BETWEEN 3 AND 3.5
WHERE parish IS NULL</pre><p>Text goes in <b>'single quotes'</b>.</p>`],
  ['Aggregates & GROUP BY', `<pre>SELECT major, COUNT(*), AVG(gpa)
FROM student
GROUP BY major
HAVING AVG(gpa) > 3.3;</pre><p><b>WHERE</b> filters rows <i>before</i> grouping. <b>HAVING</b> filters groups <i>after</i>.</p>`],
  ['JOINs', `<pre>SELECT s.fname, c.title
FROM student s
JOIN enrolment e ON s.id = e.student_id
JOIN course c    ON c.code = e.course_code;</pre>
   <p><b>LEFT JOIN</b> keeps every row from the left table, even with no match (the missing columns become NULL).</p>`],
  ['Changing data (DML) & structure (DDL)', `<pre>INSERT INTO student VALUES (9,'Ricky','Barnes','SE',3.0,1,'Portland');
UPDATE student SET gpa = 2.8 WHERE id = 5;
DELETE FROM enrolment WHERE grade = 'F';

CREATE TABLE lecturer(
  lec_id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  dept TEXT);
ALTER TABLE student ADD COLUMN email TEXT;</pre>
   <p>⚠️ An UPDATE or DELETE <b>without WHERE</b> hits every row.</p>`]
 ],
 ch:[
  {type:'sql', q:'Show everything in the student table.', expect:'SELECT * FROM student;', hint:'SELECT * FROM …', why:'<code>SELECT *</code> returns every column, and with no WHERE you get every row.'},
  {type:'sql', q:'Show only each student’s first name and GPA.', expect:'SELECT fname, gpa FROM student;', hint:'List the columns separated by commas.', why:'Choosing specific columns is a projection (π in relational algebra).'},
  {type:'sql', q:'Show all students majoring in CS.', expect:"SELECT * FROM student WHERE major='CS';", hint:"WHERE major = 'CS' (text needs single quotes)", why:'WHERE filters rows. This is σ in relational algebra.'},
  {type:'sql', q:'Show the fname and gpa of students with a GPA of at least 3.5, highest GPA first.', order:true, expect:'SELECT fname, gpa FROM student WHERE gpa >= 3.5 ORDER BY gpa DESC;', hint:'>= 3.5 and ORDER BY gpa DESC', why:'ORDER BY … DESC sorts from high to low. "At least" means >=.'},
  {type:'sql', q:'Find students whose last name starts with “W”.', expect:"SELECT * FROM student WHERE lname LIKE 'W%';", hint:"LIKE 'W%'  (% = any characters)", why:'In LIKE, % matches any sequence of characters and _ matches exactly one.'},
  {type:'sql', q:'Show each major and how many students are in it.', expect:'SELECT major, COUNT(*) FROM student GROUP BY major;', hint:'SELECT major, COUNT(*) … GROUP BY major', why:'GROUP BY makes one group per major, and COUNT(*) counts the rows in each group.'},
  {type:'sql', q:'Show each major and its average GPA, but only majors whose average GPA is above 3.3.', expect:'SELECT major, AVG(gpa) FROM student GROUP BY major HAVING AVG(gpa) > 3.3;', hint:'Filter groups with HAVING, not WHERE.', why:'HAVING filters after grouping. WHERE cannot use AVG() because the groups don’t exist yet at that point.'},
  {type:'sql', q:'List each student’s first name next to the title of every course they are enrolled in.', expect:'SELECT s.fname, c.title FROM student s JOIN enrolment e ON s.id=e.student_id JOIN course c ON c.code=e.course_code;', hint:'student → enrolment (s.id = e.student_id) → course (c.code = e.course_code)', why:'Going from STUDENT to COURSE passes through the junction table ENROLMENT, so you need two joins.'},
  {type:'sql', q:'Show the first and last names of students enrolled in CMP2018.', expect:"SELECT s.fname, s.lname FROM student s JOIN enrolment e ON s.id=e.student_id WHERE e.course_code='CMP2018';", hint:'JOIN enrolment, then WHERE course_code = …', why:'Join to get the enrolments, then filter them with WHERE.'},
  {type:'sql', q:'Show fname and gpa of students whose GPA is higher than the overall average GPA. Use a sub-query.', expect:'SELECT fname, gpa FROM student WHERE gpa > (SELECT AVG(gpa) FROM student);', hint:'WHERE gpa > (SELECT AVG(gpa) FROM student)', why:'The inner query runs first and gives one number (3.3). The outer query then compares each row against it.'},
  {type:'sql', q:'Show every course code and how many students are enrolled in it, including courses with 0 students.', expect:'SELECT c.code, COUNT(e.student_id) FROM course c LEFT JOIN enrolment e ON c.code=e.course_code GROUP BY c.code;', hint:'LEFT JOIN keeps unmatched courses. Count e.student_id, not *.', why:'LEFT JOIN keeps MAT1008 even though it has no enrolments. COUNT(e.student_id) skips NULLs, so its count is 0. COUNT(*) would wrongly give 1.'},
  {type:'sql', dml:true, q:'Add a new student: id 9, Ricky Barnes, major SE, GPA 3.0, year 1, parish Portland.', expect:"INSERT INTO student VALUES (9,'Ricky','Barnes','SE',3.0,1,'Portland');", check:'SELECT * FROM student ORDER BY id;', hint:'INSERT INTO student VALUES (…7 values in column order…)', why:'INSERT adds a row. Values go in column order: id, fname, lname, major, gpa, year, parish.'},
  {type:'sql', dml:true, q:'Dwayne Reid (id 5) passed a resit. Change his GPA to 2.8.', expect:'UPDATE student SET gpa = 2.8 WHERE id = 5;', check:'SELECT id, gpa FROM student ORDER BY id;', hint:'UPDATE … SET … WHERE id = 5', why:'Without the WHERE, every student would get 2.8.'},
  {type:'sql', dml:true, q:'Delete every enrolment where the grade is F.', expect:"DELETE FROM enrolment WHERE grade='F';", check:'SELECT * FROM enrolment ORDER BY student_id, course_code;', hint:"DELETE FROM enrolment WHERE grade = 'F'", why:'DELETE removes whole rows that match the WHERE.'},
  {type:'sql', dml:true, q:'Create a table <code>lecturer</code> with: lec_id (INTEGER, primary key), name (TEXT, NOT NULL), dept (TEXT).', html:true, expect:'CREATE TABLE lecturer(lec_id INTEGER PRIMARY KEY, name TEXT NOT NULL, dept TEXT);', check:"SELECT name, upper(type) AS type, \"notnull\", pk FROM pragma_table_info('lecturer');", hint:'CREATE TABLE lecturer( col TYPE constraints, … );', why:'This is DDL: it defines structure. PRIMARY KEY enforces entity integrity, and NOT NULL forbids empty values.'},
  {type:'sql', dml:true, q:'Add a column <code>email</code> (TEXT) to the student table.', html:true, expect:'ALTER TABLE student ADD COLUMN email TEXT;', check:"SELECT name FROM pragma_table_info('student');", hint:'ALTER TABLE … ADD COLUMN …', why:'ALTER TABLE changes an existing table’s structure without losing its data.'}
 ]},
{ id:'mongo', name:'Mongo Market', ico:'🍃', color:'linear-gradient(135deg,#2bd67b,#118a4c)', blurb:'Documents, find(), operators, embedded data', unit:'Unit 6 · NoSQL',
 lessons:[
  ['SQL vs MongoDB', `<ul><li>Table → <b>Collection</b> · Row → <b>Document</b> · Column → <b>Field</b></li>
   <li>Documents are JSON-like (BSON) and can <b>embed</b> objects and arrays.</li>
   <li>There is no fixed schema, so two documents can have different fields.</li></ul>
   <pre>{ _id: 1, name: "Alex Watson", major: "CS", gpa: 3.4,
  address: { parish: "Kingston" },
  skills: ["SQL", "Python"],
  courses: [ { code: "CMP2018", grade: "A" } ] }</pre>`],
  ['find()', `<pre>db.students.find({})                  // all
db.students.find({ major: "CS" })     // WHERE major='CS'
db.students.find({ gpa: { $gt: 3.5 } })
db.students.find({ "address.parish": "Kingston" })
db.students.find({ skills: "SQL" })   // array contains</pre>
   <p>Operators: <code>$gt $gte $lt $lte $ne $in $nin $or $and $exists $elemMatch</code></p>`],
  ['Projection, sort, limit', `<pre>db.students.find({ year: 2 }, { name: 1, gpa: 1, _id: 0 })
db.students.find({}).sort({ gpa: -1 }).limit(3)</pre>
   <p>In a projection, 1 = show and 0 = hide. In sort, 1 = ascending and -1 = descending.</p>`],
  ['Writing data', `<pre>db.students.insertOne({ _id: 9, name: "Ricky" })
db.students.updateOne({ _id: 5 }, { $set: { gpa: 2.8 } })
db.students.deleteOne({ _id: 3 })</pre>`],
  ['Embed or reference?', `<ul><li><b>Embed</b> when the data is read together and owned by the parent (a student’s address).</li>
   <li><b>Reference</b> (store an _id) when the data is shared, large, or grows without limit (a course that thousands of students take).</li></ul>`]
 ],
 ch:[
  {type:'sort', q:'Match each SQL word to its MongoDB equivalent.', cats:['Collection','Document','Field','find()'],
   items:[['Table',0],['Row',1],['Column',2],['SELECT … WHERE',3]], why:'Table ↔ collection, row ↔ document, column ↔ field, SELECT/WHERE ↔ find(filter).'},
  {type:'mongo', q:'Return every student document.', expect:'db.students.find({})', hint:'An empty filter {} matches everything.', why:'<code>find({})</code> is like <code>SELECT * FROM students</code>.'},
  {type:'mongo', q:'Find students whose major is "CS".', expect:'db.students.find({ major: "CS" })', hint:'{ field: value }', why:'Equality in Mongo is just { field: value }.'},
  {type:'mongo', q:'Find students with a GPA greater than 3.5.', expect:'db.students.find({ gpa: { $gt: 3.5 } })', hint:'{ gpa: { $gt: 3.5 } }', why:'Comparison operators go inside a nested object: <code>$gt</code> means greater than.'},
  {type:'mongo', q:'Find students who live in the parish of Kingston. (parish is inside the embedded address object.)', expect:'db.students.find({ "address.parish": "Kingston" })', hint:'Use dot notation in quotes: "address.parish"', why:'Dot notation reaches into embedded documents. Put the path in quotes.'},
  {type:'mongo', q:'Find students who have "SQL" in their skills array.', expect:'db.students.find({ skills: "SQL" })', hint:'Matching an array field against one value checks whether the array contains it.', why:'Mongo checks every element of the array, so { skills: "SQL" } means "skills contains SQL".'},
  {type:'mongo', q:'Find students whose major is either "IT" or "SE".', expect:'db.students.find({ major: { $in: ["IT", "SE"] } })', hint:'$in takes an array', why:'<code>$in</code> is like SQL <code>IN (\'IT\',\'SE\')</code>.'},
  {type:'mongo', q:'For year 2 students, show ONLY name and gpa (hide _id).', expect:'db.students.find({ year: 2 }, { name: 1, gpa: 1, _id: 0 })', hint:'Second argument is the projection. _id shows unless you set it to 0.', why:'The projection (2nd argument) chooses the fields, like the column list in SELECT.'},
  {type:'mongo', order:true, q:'Show the top 3 students by GPA (highest first).', expect:'db.students.find({}).sort({ gpa: -1 }).limit(3)', hint:'.sort({ gpa: -1 }).limit(3)', why:'-1 sorts descending. limit(3) is like SQL LIMIT 3.'},
  {type:'mongo', q:'Find students who have a GPA below 3.0 OR are in year 3.', expect:'db.students.find({ $or: [ { gpa: { $lt: 3 } }, { year: 3 } ] })', hint:'{ $or: [ {…}, {…} ] }', why:'<code>$or</code> takes an array of conditions. A document matches if any one of them is true.'},
  {type:'mongo', q:'Find students who got an "A" in CMP2018 (inside the courses array).', expect:'db.students.find({ courses: { $elemMatch: { code: "CMP2018", grade: "A" } } })', hint:'$elemMatch makes both conditions apply to the SAME array element.', why:'<code>$elemMatch</code> requires one element to match every condition. Without it, code and grade could come from different courses.'},
  {type:'mongo', write:true, q:'Insert a new student: _id 9, name "Ricky Barnes", major "SE", gpa 3.0, year 1.', expect:'db.students.insertOne({ _id: 9, name: "Ricky Barnes", major: "SE", gpa: 3.0, year: 1 })', hint:'db.students.insertOne({ … })', why:'insertOne adds a document. Unlike SQL, you didn’t have to include address or skills, because there is no fixed schema.'},

    case 'find':{let r=coll.filter(d=>matchDoc(d,a[0]||{}));let count=null;
      for(const ch of c.chain){if(ch.name==='sort'){const s=Object.entries(ch.args[0]||{});r=r.slice().sort((x,y)=>{for(const [k,dir] of s){const xa=getPath(x,k),ya=getPath(y,k);if(xa<ya)return -dir;if(xa>ya)return dir;}return 0;});}
        else if(ch.name==='limit')r=r.slice(0,ch.args[0]);else if(ch.name==='skip')r=r.slice(ch.args[0]);else if(ch.name==='count')count=r.length;else if(ch.name==='pretty'||ch.name==='toArray'){}else throw new Error('Unsupported .'+ch.name+'()');}
      if(count!==null)return {kind:'count',value:count};
      return {kind:'docs',value:r.map(d=>project(d,a[1]))};}
    case 'findOne':{const d=coll.find(x=>matchDoc(x,a[0]||{}));return {kind:'docs',value:d?[project(d,a[1])]:[]};}
    case 'countDocuments':return {kind:'count',value:coll.filter(d=>matchDoc(d,a[0]||{})).length};
    case 'insertOne':{if(!a[0]||typeof a[0]!=='object')throw new Error('insertOne needs a document { }');const d=clone(a[0]);if(d._id===undefined)d._id=Math.max(0,...coll.map(x=>+x._id||0))+1;
      if(coll.some(x=>eqv(x._id,d._id)))throw new Error('Duplicate key: _id '+d._id+' already exists');coll.push(d);return {kind:'msg',value:{acknowledged:true,insertedId:d._id}};}
    case 'insertMany':{a[0].forEach(d=>{d=clone(d);if(coll.some(x=>eqv(x._id,d._id)))throw new Error('Duplicate _id '+d._id);coll.push(d);});return {kind:'msg',value:{acknowledged:true,insertedCount:a[0].length}};}
    case 'updateOne':case 'updateMany':{const ms=coll.filter(d=>matchDoc(d,a[0]||{}));const t=c.method==='updateOne'?ms.slice(0,1):ms;t.forEach(d=>applyUpdate(d,a[1]||{}));return {kind:'msg',value:{matchedCount:ms.length,modifiedCount:t.length}};}
    case 'deleteOne':case 'deleteMany':{const ms=coll.filter(d=>matchDoc(d,a[0]||{}));const t=c.method==='deleteOne'?ms.slice(0,1):ms;t.forEach(d=>coll.splice(coll.indexOf(d),1));return {kind:'msg',value:{deletedCount:t.length}};}
    default:throw new Error('Unsupported method .'+c.method+'()');
  }
}

    try{v=parse();}catch(e){out.innerHTML=`<div class="err">✗ Not valid JSON yet: ${esc(e.message)}</div>`;judge(false,'It doesn’t parse yet. Look for missing quotes or commas, or extra commas.');return;}
    const ok=canon(v)===canon(c.target);
    out.innerHTML=ok?`<div class="ok">✓ Valid and correct</div>`:`<div class="ok">✓ Valid JSON, but the data is different from what was asked</div><pre>${esc(JSON.stringify(v,null,2))}</pre>`;
    judge(ok,'It parses, but the keys, values or types don’t match. Check spelling, and numbers vs "strings".',ok?`<pre>${esc(JSON.stringify(c.target,null,2))}</pre>`:'');});
 },
 xml(c){
  $('#area').innerHTML=`<textarea class="ed" id="ed" ${edAttrs} placeholder="Type XML here…">${esc(CUR.state.code!=null?CUR.state.code:c.start)}</textarea>${keyBar('xml','ed')}
   <div class="row" style="margin-top:8px"><button class="btn o sm" id="run">🔍 Is it well-formed?</button></div><div class="out" id="out"></div>`;
  const out=$('#out');
  const parse=()=>{const src=$('#ed').value.trim();if(!src)throw new Error('Type some XML first.');const d=new DOMParser().parseFromString(src,'application/xml');const pe=d.getElementsByTagName('parsererror')[0];
    if(pe)throw new Error((pe.textContent||'Parse error').replace(/Below is a rendering.*$/s,'').trim().slice(0,240));return d;};
  $('#run').onclick=()=>{try{parse();out.innerHTML='<div class="ok">✓ Well-formed XML</div>';}catch(e){out.innerHTML=`<div class="err">✗ ${esc(e.message)}</div>`;}};
  setCheck(()=>{CUR.state.code=$('#ed').value;let d;
    try{d=parse();}catch(e){out.innerHTML=`<div class="err">✗ Not well-formed: ${esc(e.message)}</div>`;judge(false,'The XML isn’t well-formed yet. Check that every tag closes with matching case.');return;}
    const m=XML_CHECKS[c.check](d); out.innerHTML=m?`<div class="ok">✓ Well-formed, but…</div><div class="err">${esc(m)}</div>`:'<div class="ok">✓ Well-formed and correct</div>';
    judge(!m,m);});
 }
};

function judge(ok,msg,extra=''){
  const c=CUR.c, ctx=CUR.ctx;
  if(ctx.mode==='boss'){ // one shot
    if(ok)ctx.score++;
    S.xp+=ok?15:2; save();
    sheet(ok, ok?'Correct!':'Missed it', `${ok?'':esc(msg)+'<br><br>'}${c.why}`+extra, ctx.i+1<ctx.list.length?'Next question ›':'See results 🏁', ()=>{ctx.i++; ctx.i<ctx.list.length?play(ctx.list[ctx.i],ctx):bossEnd(ctx);}, null);
    return;
  }
  CUR.attempts++;
  if(ok){
    const st=Math.max(1,3-(CUR.attempts-1)-(CUR.hint?1:0)); const prev=S.stars[c.id]||0;
    const gain=prev?3:(st*10); S.xp+=gain; if(st>prev)S.stars[c.id]=st;
    S.streak=CUR.attempts===1?S.streak+1:0; save();
    const lvBefore=Math.floor((S.xp-gain)/100)+1; if(level()>lvBefore){setTimeout(()=>toast('🎉 Level up! Lv '+level()+' · '+rank()),400);}
    if(st===3)confetti();
    const w=worldById(c.world); const nxt=w.ch[c.idx+1];
    sheet(true, ['Wicked!','Bad! (the good kind)','Nailed it!','Big up yourself!','Correct!'][Math.floor(Math.random()*5)]+' '+starStr(st), c.why+extra+`<div style="margin-top:8px;font-weight:800;color:var(--gold)">+${gain} XP ${S.streak>1?'· 🔥 '+S.streak+' streak':''}</div>`,
      nxt?'Next challenge ›':'World complete 🏁', ()=>nxt?play(nxt,ctx):worldDone(w), null);
  } else {
    S.streak=0; save();
    const card=$('#qcard'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    const showWhy=CUR.attempts>=3;
    sheet(false,'Not yet…', esc(msg)+(showWhy?`<br><br><b>Explanation:</b> ${c.why}`:''), 'Try again', hideSheet, showWhy&&c.type!=='mcq'&&c.type!=='sort'&&c.type!=='build'?null:null);
  }
}
function sheet(good,title,body,btn,fn){
  const sh=$('#sheet'); $('#sheetIn').innerHTML=`<h3>${title}</h3><p>${body}</p><button class="btn ${good?'g':''} wide" id="sheetBtn">${btn}</button>`;
  sh.className='sheet show '+(good?'good':'bad'); $('#sheetBtn').onclick=fn;
}
function worldDone(w){
  hideSheet(); const st=worldStars(w),mx=w.ch.length*3; confetti();
  app.innerHTML=topBar(w.ico+' '+w.name,'Complete!')+`<div class="card center"><div class="big">🏆</div><h2>${w.name} cleared!</h2>
    <p class="muted">★ ${st} / ${mx} stars</p><p>${st===mx?'Perfect run. You’re ready for this on the exam.':'Replay any challenge with fewer than 3 stars to master it.'}</p>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn o" id="again">Replay world</button><button class="btn g" id="homeB">Back to map</button></div></div>`;
  $('#backBtn').onclick=home; $('#homeB').onclick=home; $('#again').onclick=()=>worldScreen(w.id);
}
function startBoss(){
  const pool=ALL.slice().sort(()=>Math.random()-.5);
  const list=[]; WORLDS.forEach(w=>{const p=pool.filter(c=>c.world===w.id);list.push(p[0],p[1]);});
  list.sort(()=>Math.random()-.5);
  play(list[0],{mode:'boss',list,i:0,score:0});
}
function bossEnd(ctx){
  hideSheet(); const sc=ctx.score; if(sc>S.bossBest)S.bossBest=sc; S.xp+=sc*5; save(); if(sc>=9)confetti();
  const grade=sc>=11?'A':sc>=9?'B':sc>=7?'C':sc>=5?'D':'F';
  app.innerHTML=topBar('👑 Exam Boss','Results')+`<div class="card center"><div class="big">${sc>=9?'👑':sc>=6?'💪':'📚'}</div>
   <h2>${sc} / ${ctx.list.length}  ·  Grade ${grade}</h2><p class="muted">Best: ${S.bossBest}/12 · +${sc*5} bonus XP</p>
   <p>${sc>=9?'Exam-ready. Big up!':'Go back through the worlds you missed, then fight again.'}</p>
   <div class="row" style="justify-content:center"><button class="btn y" id="again">Fight again</button><button class="btn o" id="homeB">Map</button></div></div>`;
  $('#backBtn').onclick=home; $('#homeB').onclick=home; $('#again').onclick=startBoss;
}

/* ---------- SANDBOX ---------- */
let SANDDB=null, SANDCOLL=null;
function sandbox(tab){
  hideSheet();
  app.innerHTML=topBar('🛠️ Sandbox','Free play. Nothing is graded.')+`<div class="tabs">${['sql','mongo','json','xml'].map(t=>`<button data-t="${t}" class="${t===tab?'on':''}">${t.toUpperCase()}</button>`).join('')}</div>
   <div class="card" id="sb"></div>`;
  $('#backBtn').onclick=home; app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>sandbox(b.dataset.t));
  const sb=$('#sb');
  if(tab==='sql'){
    sb.innerHTML=`<div class="muted" style="font-size:13.5px">Tables: student, course, enrolment. Your changes stay until you reset. You can run several statements at once.</div>
    <textarea class="ed" id="sed" ${edAttrs} style="min-height:160px">SELECT major, COUNT(*) AS students, ROUND(AVG(gpa),2) AS avg_gpa
FROM student
GROUP BY major;</textarea>${keyBar('sql','sed')}
    <div class="row" style="margin-top:8px"><button class="btn sm" id="srun">▶ Run</button><button class="btn o sm" id="sreset">↺ Reset DB</button><button class="btn o sm" id="sschema">🗂 Schema</button></div><div class="out" id="sout"></div>`;
    const out=$('#sout');
    const ensure=fn=>sqlReady.then(()=>{if(sqlErr){out.innerHTML=`<div class="err">SQL engine failed to start: ${esc(sqlErr.message)}</div>`;return;}if(!SANDDB)SANDDB=freshDB();fn();});
    $('#srun').onclick=()=>ensure(()=>{try{const res=SANDDB.exec($('#sed').value);out.innerHTML=res.length?res.map(r=>tableHTML(r)).join(''):`<div class="ok">✓ Done. ${SANDDB.getRowsModified()} row(s) changed.</div>`;}catch(e){out.innerHTML=`<div class="err">⚠ ${esc(e.message)}</div>`;}});
    $('#sreset').onclick=()=>ensure(()=>{SANDDB.close();SANDDB=freshDB();out.innerHTML='<div class="ok">Database reset to the original data.</div>';});
    $('#sschema').onclick=()=>ensure(()=>{out.innerHTML=tableHTML(SANDDB.exec("SELECT name, sql FROM sqlite_master WHERE type='table'")[0]);});
  } else if(tab==='mongo'){
    if(!SANDCOLL)SANDCOLL={students:clone(MONGO_STUDENTS)};
    sb.innerHTML=`<div class="muted" style="font-size:13.5px">Collection: db.students. Supports find, findOne, countDocuments, insertOne/Many, updateOne/Many, deleteOne/Many, sort, limit and skip.</div>
    <textarea class="ed" id="sed" ${edAttrs}>db.students.find({ gpa: { $gte: 3.5 } }, { name: 1, gpa: 1, _id: 0 }).sort({ gpa: -1 })</textarea>${keyBar('mongo','sed')}
    <div class="row" style="margin-top:8px"><button class="btn sm" id="srun">▶ Run</button><button class="btn o sm" id="sreset">↺ Reset</button></div><div class="out" id="sout"></div>`;
    $('#srun').onclick=()=>{try{$('#sout').innerHTML=mongoHTML(runMongo($('#sed').value,SANDCOLL));}catch(e){$('#sout').innerHTML=`<div class="err">⚠ ${esc(e.message)}</div>`;}};
    $('#sreset').onclick=()=>{SANDCOLL={students:clone(MONGO_STUDENTS)};$('#sout').innerHTML='<div class="ok">Collection reset.</div>';};
  } else if(tab==='json'){
    sb.innerHTML=`<textarea class="ed" id="sed" ${edAttrs} style="min-height:180px">{
  "code": "CMP2018",
  "title": "Database Design",
  "credits": 3,
  "units": ["ER", "Relational", "SQL", "NoSQL"]
}</textarea>${keyBar('json','sed')}<div class="row" style="margin-top:8px"><button class="btn sm" id="srun">🔍 Validate & format</button><button class="btn o sm" id="sxml">→ Convert to XML</button></div><div class="out" id="sout"></div>`;
    $('#srun').onclick=()=>{try{$('#sout').innerHTML=`<div class="ok">✓ Valid JSON</div><pre>${esc(JSON.stringify(JSON.parse($('#sed').value),null,2))}</pre>`;}catch(e){$('#sout').innerHTML=`<div class="err">✗ ${esc(e.message)}</div>`;}};
    $('#sxml').onclick=()=>{try{const v=JSON.parse($('#sed').value);$('#sout').innerHTML=`<div class="lbl">As XML</div><pre>${esc(toXML(v,'root',''))}</pre>`;}catch(e){$('#sout').innerHTML=`<div class="err">✗ ${esc(e.message)}</div>`;}};
  } else {
    sb.innerHTML=`<textarea class="ed" id="sed" ${edAttrs} style="min-height:180px">&lt;?xml version="1.0"?&gt;
&lt;course code="CMP2018"&gt;
  &lt;title&gt;Database Design&lt;/title&gt;
  &lt;credits&gt;3&lt;/credits&gt;
&lt;/course&gt;</textarea>${keyBar('xml','sed')}<div class="row" style="margin-top:8px"><button class="btn sm" id="srun">🔍 Check well-formed</button><button class="btn o sm" id="sjson">→ Convert to JSON</button></div><div class="out" id="sout"></div>`;
    const parse=()=>{const d=new DOMParser().parseFromString($('#sed').value.trim(),'application/xml');const pe=d.getElementsByTagName('parsererror')[0];if(pe)throw new Error(pe.textContent.replace(/Below is a rendering.*$/s,'').trim().slice(0,240));return d;};
    $('#srun').onclick=()=>{try{parse();$('#sout').innerHTML='<div class="ok">✓ Well-formed XML</div>';}catch(e){$('#sout').innerHTML=`<div class="err">✗ ${esc(e.message)}</div>`;}};
    $('#sjson').onclick=()=>{try{const d=parse();const r=d.documentElement;$('#sout').innerHTML=`<div class="lbl">As JSON</div><pre>${esc(JSON.stringify({[r.nodeName]:fromXML(r)},null,2))}</pre>`;}catch(e){$('#sout').innerHTML=`<div class="err">✗ ${esc(e.message)}</div>`;}};
  }
}
function toXML(v,tag,ind){const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  if(Array.isArray(v))return v.map(e=>toXML(e,tag.replace(/s$/,'')||'item',ind)).join('\n');
  if(v&&typeof v==='object')return `${ind}<${tag}>\n${Object.entries(v).map(([k,e])=>Array.isArray(e)?`${ind}  <${k}>\n${toXML(e,k,ind+'    ')}\n${ind}  </${k}>`:toXML(e,k,ind+'  ')).join('\n')}\n${ind}</${tag}>`;
  return `${ind}<${tag}>${x(v)}</${tag}>`;}
function fromXML(el){const kids=[...el.children];const o={};[...el.attributes].forEach(a=>o['@'+a.name]=a.value);
  if(!kids.length){const t=el.textContent.trim();return Object.keys(o).length?Object.assign(o,{'#text':t}):(t!==''&&!isNaN(t)?+t:t);}
  kids.forEach(k=>{const v=fromXML(k);if(o[k.nodeName]!==undefined){if(!Array.isArray(o[k.nodeName]))o[k.nodeName]=[o[k.nodeName]];o[k.nodeName].push(v);}else o[k.nodeName]=v;});return o;}

home();
</script>
