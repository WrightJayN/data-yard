   check:"SELECT lower(name) AS name, \"notnull\", pk FROM pragma_table_info('task');",
   verify(db){if(!sqlCount(db,"SELECT count(*) FROM pragma_foreign_key_list('task') WHERE lower(\"table\")='project'"))return 'projectID should be a foreign key that references project.';
     let i=1;for(const s of ['pending','in progress','complete'])if(!sqlTry(db,`INSERT INTO task(taskID,title,status,projectID) VALUES (${i++},'t','${s}',7001)`))return `The status '${s}' was rejected. It should be allowed.`;
     if(sqlTry(db,"INSERT INTO task(taskID,title,status,projectID) VALUES (9,'t','done',7001)"))return "The status 'done' was accepted. Use CHECK (status IN ('pending','in progress','complete')).";return '';},
   hint:"status TEXT CHECK (status IN ('pending','in progress','complete'))", why:'CHECK … IN limits a column to a fixed list of values. NOT NULL forbids an empty title.'},
  {type:'sql', dml:true, tables:CASES.firm, q:'Create a view <code>vwStaff</code> that shows, for every employee who has a supervisor: the employee’s first name, last name and salary, then the supervisor’s first name and last name.', html:true,
   expect:'CREATE VIEW vwStaff AS SELECT e.firstName, e.lastName, e.salary, s.firstName, s.lastName FROM employee e JOIN employee s ON e.supervisorID = s.empID;', check:'SELECT * FROM vwStaff;',
   hint:'Join employee to itself: FROM employee e JOIN employee s ON e.supervisorID = s.empID', why:'A self-join uses two aliases for the same table: one row plays the employee, the other the supervisor.'},
  {type:'sql', dml:true, tables:CASES.wk, q:'Make sure the fees for all cancelled workshops are reduced by 5%.', expect:"UPDATE workshop SET fee = fee * 0.95 WHERE status = 'cancelled';", check:'SELECT workshopID, fee FROM workshop ORDER BY workshopID;', hint:"fee * 0.95 WHERE status = 'cancelled'", why:'Reducing by 5% leaves 95%, so multiply by 0.95.'},
  {type:'sql', dml:true, tables:CASES.wk, q:'Create a view <code>vwWorkshopSchedule</code> showing the workshop title, date, fee, venue name, parish, trainer’s first name, last name, email and hourly rate (in that order) for all workshops that are not cancelled.', html:true,
   expect:"CREATE VIEW vwWorkshopSchedule AS SELECT w.title, w.wkshopDate, w.fee, v.venueName, v.parish, t.firstName, t.lastName, t.email, t.hourlyRate FROM workshop w JOIN venue v ON w.venueID = v.venueID JOIN trainer t ON w.trainerID = t.trainerID WHERE w.status <> 'cancelled';",
   check:'SELECT * FROM vwWorkshopSchedule;', hint:"Two joins (venue, trainer), then WHERE w.status <> 'cancelled'", why:'A view stores the query, not the data. Users can then SELECT from it like a table.'},
  {type:'sql', dml:true, tables:CASES.wk, q:'Delete all participants who are from a country where the second character in the country’s name is a z.', expect:"DELETE FROM participant WHERE country LIKE '_z%';", check:'SELECT participantID, country FROM participant ORDER BY participantID;', hint:"_ matches exactly one character: '_z%'", why:'_ stands for the first character, z must be second, and % allows anything after. Uzbekistan and Czechia match.'},
  {type:'sort', q:'Match each relational algebra operator to its SQL equivalent.', cats:['WHERE','SELECT column list','JOIN … ON','EXCEPT / NOT IN','UNION','FROM A, B'],
   items:[['σ selection',0],['π projection',1],['⋈ natural join',2],['− difference',3],['∪ union',4],['× Cartesian product',5]],
   why:'σ picks rows (WHERE), π picks columns (SELECT list), ⋈ matches rows (JOIN), − removes rows found in another relation (EXCEPT), ∪ combines (UNION), × pairs every row with every row (FROM A, B).'},
  {type:'ra', tables:CASES.uni, q:'Show the names of all students who are from Canada.', expect:"π studentName (σ country = 'Canada' (Student))", hint:"π studentName ( σ country = 'Canada' ( Student ) )", why:'σ keeps the Canadian rows, then π keeps only the name. Work from the inside out.'},
  {type:'ra', tables:CASES.uni, q:'Show the student names and grades of all students enrolled in course CMP2018.', expect:"π studentName, grade (σ courseID = 'CMP2018' (Student ⋈ Enrollment))", hint:"Join Student and Enrollment, select the course, project the two columns.", why:'Student ⋈ Enrollment matches on studentID. σ keeps CMP2018, then π keeps name and grade.'},
  {type:'ra', tables:CASES.uni, q:'Show the names of lecturers who do not teach any course.', expect:'π lecturerName (Lecturer) − π lecturerName (Lecturer ⋈ Teaches)', hint:'All lecturers − lecturers who appear in Teaches', why:'The "not any" pattern: everyone, minus those found in the join. Both sides must project the same attributes (union-compatible).'},
  {type:'ra', tables:CASES.wk, q:'Show the title, date and fee of all workshops that are cancelled and have a fee in excess of $25,000.', expect:"π title, wkshopDate, fee (σ status = 'cancelled' ∧ fee > 25000 (Workshop))", hint:'Combine two conditions with ∧ inside one σ.', why:'∧ (and) joins the two conditions in a single selection.'},
  {type:'ra', tables:CASES.wk, q:'Show the first and last names of trainers who are not assigned to any workshop.', expect:'π firstName, lastName (Trainer) − π firstName, lastName (Trainer ⋈ Workshop)', hint:'Trainers − trainers who appear in a join with Workshop', why:'Trainer ⋈ Workshop keeps only trainers with workshops. Subtracting them from all trainers leaves the unassigned ones.'},
  {type:'ra', tables:CASES.wk, q:'Show the first name, last name and email of all participants registered for a workshop in Kingston (parish) that is cancelled.', expect:"π firstName, lastName, email (σ parish = 'Kingston' ∧ status = 'cancelled' (Participant ⋈ Registration ⋈ Workshop ⋈ Venue))", hint:'Chain four natural joins, then one σ with ∧.', why:'Each ⋈ links on a shared key: participantID, then workshopID, then venueID. The selection then keeps cancelled Kingston workshops.'},
  {type:'ra', tables:CASES.uni, q:'Use assignment (←) and intersection: show the IDs of lecturers who taught in both semester 2025-S2 and semester 2026-S1.', expect:"A ← π lecturerID (σ semester = '2025-S2' (Teaches))\nB ← π lecturerID (σ semester = '2026-S1' (Teaches))\nA ∩ B", hint:"A ← π lecturerID (σ semester = '2025-S2' (Teaches)), then B for 2026-S1, then A ∩ B", why:'Assignment names partial results. ∩ keeps the IDs that appear in both.'},
  {type:'ra', tables:CASES.uni, q:'Use rename (ρ): show the names of other students who have the same major as Priya Singh.', expect:"π S2.studentName (σ S1.studentName = 'Priya Singh' ∧ S1.major = S2.major ∧ S2.studentName ≠ 'Priya Singh' (ρ S1 (Student) × ρ S2 (Student)))", hint:'ρ S1 (Student) × ρ S2 (Student), then compare S1.major = S2.major', why:'Renaming gives two copies of Student so each row can be compared with every other. This is how relational algebra does a self-join.'},
  {type:'mcq', q:'Give the English meaning of: <code>π venueName (Venue) − π venueName (Venue ⋈ Workshop)</code>', html:true,
   opts:['Names of all venues','Names of venues where no workshop is held','Names of venues that host every workshop','Workshops held at each venue'], a:1,
   why:'The left side is every venue; the right side is venues that join to a workshop. The difference is the venues with no workshops.'},
  {type:'mcq', q:'What does this relational calculus return? <code>{ l.lecturerName | Lecturer(l) ∧ ¬∃ t (Teaches(t) ∧ t.lecturerID = l.lecturerID) }</code>', html:true,
   opts:['Every lecturer’s name','Names of lecturers who teach no course','Names of lecturers who teach every course','The number of lecturers'], a:1,
   why:'¬∃ means "there is no". It returns lecturers for whom no Teaches tuple exists, the same answer as the difference query.'},
  {type:'mcq', q:'R ∪ S, R ∩ S and R − S only work when R and S are…', opts:['The same size','Union-compatible: the same number of attributes with matching domains','Joined first','In 3NF'], a:1,
   why:'Set operations compare whole tuples, so both sides need the same degree and matching domains.'}
 ]},
{ id:'mongo', name:'Mongo Market', blurb:'Paper Q5 / Q6: what NoSQL is, how it differs from an RDBMS, its four families, structured vs semi-structured vs unstructured data, and keys in MongoDB.', unit:'Lecture 10',
 lessons:[
  ['What NoSQL means', `<p><b>NoSQL</b> ("not only SQL") databases store data without fixed relational tables. They are:</p>
   <ul><li><b>Schema-flexible</b>: records in one collection can have different fields.</li>
   <li><b>Horizontally scalable</b>: add more cheap servers instead of a bigger one.</li>
   <li><b>Distributed and highly available</b>, often with eventual consistency (BASE) instead of strict ACID.</li>
   <li>Built for <b>big data</b>: large volume, high velocity, wide variety, and modern web and mobile apps.</li></ul>`],
  ['NoSQL vs relational (RDBMS)', `<div class="tbl"><table><tr><th></th><th>RDBMS</th><th>NoSQL</th></tr>
   <tr><td>Structure</td><td>Tables, fixed schema</td><td>Documents, key-value, columns, graphs</td></tr>
   <tr><td>Schema</td><td>Defined first</td><td>Flexible, per record</td></tr>
   <tr><td>Scaling</td><td>Vertical (bigger server)</td><td>Horizontal (more servers)</td></tr>
   <tr><td>Consistency</td><td>ACID transactions</td><td>Often eventual (BASE)</td></tr>
   <tr><td>Joins / integrity</td><td>Joins, enforced FKs</td><td>Few joins, app-managed links</td></tr>
   <tr><td>Best for</td><td>Payments, records, reports</td><td>Varied, fast-growing, unstructured data</td></tr></table></div>
   <p>Many systems use <b>both</b>: relational for accounts and money, NoSQL for catalogues, logs and posts.</p>`],
  ['The four NoSQL families', `<ul><li><b>Document</b> (MongoDB, CouchDB): JSON-like documents. Product catalogues, user profiles, content management.</li>
   <li><b>Key-value</b> (Redis, DynamoDB): a value looked up by a key. Sessions, shopping carts, caching.</li>
   <li><b>Column-family / wide-column</b> (Cassandra, HBase): data stored by column families, built for huge write loads and analytics. Logs, IoT sensor data, time series.</li>
   <li><b>Graph</b> (Neo4j): nodes and edges. Social networks, recommendations, fraud rings.</li></ul>
   <p><b>Column vs document</b>: a column store groups values by column, so reading one attribute across millions of rows is fast. A document store keeps a whole record together as one nested document, so reading one object is fast and its fields can vary.</p>`],
  ['Structured, semi-structured, unstructured', `<ul><li><b>Structured</b>: fixed schema, rows and columns, easy to query with SQL. <i>Customer accounts, student records.</i></li>
   <li><b>Semi-structured</b>: no fixed table, but self-describing tags or keys, and fields can vary. <i>JSON, XML, logs with varying attributes, a catalogue where products have different attributes.</i></li>
   <li><b>Unstructured</b>: no predefined model. <i>Free text, images, audio, video, recorded lectures, posts with attachments.</i></li></ul>
   <p>NoSQL handles semi-structured and unstructured data because it doesn’t force every record into the same columns. That matters for big data and modern web apps, where most new data is not tabular.</p>`],
  ['MongoDB basics', `<ul><li>Table → <b>collection</b> · Row → <b>document</b> · Column → <b>field</b></li><li>Every document has a unique <code>_id</code> (its primary key).</li></ul>
   <pre>db.students.find({ major: "CS" })
db.students.find({ gpa: { $gt: 3.5 } })
db.students.find({ "address.parish": "Kingston" })
db.students.insertOne({ _id: 9, name: "Ricky" })</pre>`],
  ['Keys and relationships in MongoDB', `<ul><li><b>Primary key</b>: <code>_id</code>, unique in each collection.</li>
   <li><b>"Foreign key"</b>: store the other document’s <code>_id</code> as a field (a <b>manual reference</b>, or a DBRef). Join it at query time with <code>$lookup</code> in an aggregation.</li>
   <li>MongoDB does <b>not</b> enforce referential integrity; the application must.</li>
   <li><b>Embed</b> data that is owned and read together (an address). <b>Reference</b> data that is shared, large or changes often (a course taken by thousands).</li></ul>
   <pre>{ _id: 7001, projectName: "Payroll Upgrade", clientID: 3001 }
db.projects.aggregate([{ $lookup: { from: "clients",
  localField: "clientID", foreignField: "_id", as: "client" } }])</pre>`]
 ],
 ch:[
  {type:'mcq', q:'Which is the best description of a NoSQL database?', opts:['A relational database with no SQL support','A non-relational database that stores data as documents, key-value pairs, columns or graphs, with a flexible schema and horizontal scaling','A spreadsheet','A database that cannot be queried'], a:1,
   why:'NoSQL means "not only SQL": non-relational models, flexible schemas, and scaling across many servers.'},
  {type:'sort', q:'An online shop collects this data. Classify each item.', cats:['Structured','Semi-structured','Unstructured'],
   items:[['Customer account rows (ID, name, email, purchase total)',0],['Product reviews with free-text comments and optional photos',2],['Website activity logs where entries have different attributes',1],['A product catalogue where phones list battery life and shirts list fabric',1],['Recorded lecture videos',2],['Student records with ID, name, email and programme',0],['Discussion posts with text, images and attachments',2]],
   hint:'Fixed columns = structured. Keys or tags but varying fields = semi-structured. No model at all = unstructured.',
   why:'Fixed tables are structured. Logs and catalogues have labelled fields that vary, so they are semi-structured. Free text, photos, videos and attachments have no predefined model, so they are unstructured.'},
  {type:'sort', q:'Which NoSQL family fits each use case best?', cats:['Document','Key-value','Column-family','Graph'],
   items:[['A catalogue where each product has different attributes',0],['Shopping carts and login sessions looked up by session ID',1],['Billions of sensor readings written every day',2],['Friend-of-a-friend recommendations',3],['Course information where each course type has different fields',0],['Detecting fraud rings of linked accounts',3]],
   hint:'Nested varying records → document. Lookup by one key → key-value. Huge write volume → column. Connections → graph.',
   why:'Documents hold varying nested records. Key-value stores are fastest for a lookup by key. Column-family stores handle huge write loads. Graphs are built for relationships between things.'},
  {type:'mcq', q:'How do column-oriented NoSQL databases differ from document-oriented ones?',
   opts:['They are identical','A column store groups values by column (fast for reading one attribute across many rows); a document store keeps each whole record together as a nested document (fast for reading one object, with fields that can vary)','A document store has no keys','A column store only holds images'], a:1,
   why:'Cassandra and HBase organise data by column family for analytics and heavy writes. MongoDB keeps each object together as a JSON-like document.'},
  {type:'mcq', q:'Which statement about NoSQL compared with an RDBMS is TRUE?',
   opts:['NoSQL always enforces foreign keys','NoSQL usually scales horizontally across many servers and allows records with different fields','An RDBMS cannot store numbers','NoSQL needs every record to have the same columns'], a:1,
   why:'Horizontal scaling and a flexible schema are NoSQL’s main strengths. An RDBMS has a fixed schema, enforced relationships and ACID transactions.'},
  {type:'mcq', q:'An online learning company wants to move its discussion posts and varied course information to NoSQL, but keep student records and payments in its relational database. Is this appropriate?',
   opts:['No, everything must stay relational','Yes: varied and unstructured data suits NoSQL’s flexible schema and scaling, while structured records and payments need the RDBMS’s fixed schema, integrity and ACID transactions','No, NoSQL can’t store text','Yes, and it should also delete the relational database'], a:1,
   why:'Use each tool for what it does best. Flexible, fast-growing data goes to NoSQL. Structured data that needs integrity and transactions stays relational.'},
  {type:'mcq', q:'How can you achieve a primary key–foreign key relationship in MongoDB?',
   opts:['Declare FOREIGN KEY in the collection','Each document’s _id is its primary key; store another document’s _id as a field (a reference) and join with $lookup. MongoDB won’t enforce it.','MongoDB can’t relate documents','Copy every related document into one big document'], a:1,
   why:'_id plays the PK role. A stored _id acts like an FK, and $lookup does the join. Referential integrity is left to the application.'},
  {type:'mcq', q:'Why do NoSQL databases matter for big data and modern web applications?',
   opts:['They are older than relational databases','They handle huge volume, high velocity and wide variety by scaling across servers and storing data without a fixed schema','They need less security','They only work offline'], a:1,
   why:'Big data is high in volume, velocity and variety. Spreading load over many servers and accepting varied structures lets NoSQL keep up.'},
  {type:'sort', q:'Match each SQL term to its MongoDB equivalent.', cats:['Collection','Document','Field','find()'],
   items:[['Table',0],['Row',1],['Column',2],['SELECT … WHERE',3]], why:'Table ↔ collection, row ↔ document, column ↔ field, SELECT/WHERE ↔ find(filter).'},
  {type:'mongo', q:'Find students whose major is "CS".', expect:'db.students.find({ major: "CS" })', hint:'{ field: value }', why:'Equality in Mongo is just { field: value }.'},
  {type:'mongo', q:'Find students with a GPA greater than 3.5.', expect:'db.students.find({ gpa: { $gt: 3.5 } })', hint:'{ gpa: { $gt: 3.5 } }', why:'Comparison operators go inside a nested object: <code>$gt</code> means greater than.'},
  {type:'mongo', q:'Find students who live in the parish of Kingston. (parish is inside the embedded address object.)', expect:'db.students.find({ "address.parish": "Kingston" })', hint:'Use dot notation in quotes: "address.parish"', why:'Dot notation reaches into embedded documents, which is how a document store keeps related data together.'},
  {type:'mongo', write:true, q:'Insert a new student: _id 9, name "Ricky Barnes", major "SE". Leave out every other field.', expect:'db.students.insertOne({ _id: 9, name: "Ricky Barnes", major: "SE" })', hint:'db.students.insertOne({ … })', why:'This document has fewer fields than the others and MongoDB accepts it. That is the flexible schema in action; an RDBMS would need values (or NULLs) for every column.'},
  {type:'mcq', q:'Each course is taken by thousands of students and its details change often. Inside student documents, you should…', opts:['Embed full course details in every student','Reference courses by code/_id','Store courses as XML','Use one giant document'], a:1,
   why:'Shared, large or often-updated data should be referenced. Embedding it would copy it thousands of times, which is the same redundancy problem normalisation solves.'}
 ]},
{ id:'json', name:'JSON Junction', blurb:'Paper Q5 / Q6: represent tables and records in JSON, with nested objects for composite attributes and arrays for multivalued ones.', unit:'Lecture 10',
 lessons:[
  ['JSON rules', `<ul><li>Objects <code>{ }</code> hold <b>"key": value</b> pairs. Keys must be in <b>double quotes</b>.</li>
   <li>Arrays <code>[ ]</code> hold ordered values.</li>
   <li>Types: string, number, true/false, null, object, array. There is <b>no date type</b> and no comments.</li>
   <li><b>No trailing commas.</b> Use "double quotes" only. Numbers have no quotes.</li></ul>`],
  ['From a table to JSON', `<ul><li>Each row → one <b>object</b>; the whole table → an <b>array</b> of objects.</li>
   <li><b>Composite</b> attribute (Name: First, Last) → a nested object.</li>
   <li><b>Multivalued</b> attribute (Dependents, Genres) → an array.</li>
   <li><b>Yes/No</b> → <code>true</code>/<code>false</code>. Amounts and counts → numbers.</li></ul>
<pre>[
  { "TRN": 10345,
    "name": { "first": "Kerry-Ann", "last": "Mills" },
    "dependents": ["Jaden Mills", "Zoe Mills"] }
]</pre>`],
  ['Grouping', `<p>Grouping by a field turns a list into an object keyed by each group value:</p>
<pre>[{"name":"Kavi","dept":"IT"}, {"name":"Rhea","dept":"HR"}]
→ { "IT": [ {"name":"Kavi","dept":"IT"} ],
    "HR": [ {"name":"Rhea","dept":"HR"} ] }</pre>`],
  ['Reading JSON and when to use it', `<pre>data.name.first        → "Kerry-Ann"
data.dependents[0]     → "Jaden Mills"</pre><p>Arrays count from <b>0</b>.</p>
   <ul><li>Use JSON for web APIs and JavaScript apps, config files and document databases (MongoDB).</li>
   <li>It is lighter than XML and maps straight to JavaScript objects; XML is stronger for documents and strict schemas.</li></ul>`]
 ],
 ch:[
  {type:'mcq', q:'Which one is VALID JSON?', html:true, opts:['<code>{name: "Alex"}</code>','<code>{\'name\': \'Alex\'}</code>','<code>{"name": "Alex",}</code>','<code>{"name": "Alex"}</code>'], a:3,
   why:'Keys need double quotes, strings need double quotes, and trailing commas are not allowed.'},
  {type:'mcq', q:'Which is NOT a JSON data type?', opts:['string','boolean','date','null'], a:2,
   why:'JSON has no date type. Dates are stored as strings, for example "2026-11-10".'},
  {type:'json', q:'Fix this broken JSON so it parses. Keep the same data.', start:`{title: 'Data Modelling', "fee": 30000, "modes": ["Online", "Face-to-Face",], }`,
   target:{title:'Data Modelling',fee:30000,modes:['Online','Face-to-Face']}, hint:'Quote the key with double quotes, swap the single quotes, and remove both trailing commas.', why:'There were three problems: an unquoted key, single-quoted strings, and trailing commas.'},
  {type:'json', q:'Represent this table in JSON as an array of two objects. Use the keys <code>TRN</code> (a number), <code>name</code> (an object with <code>first</code> and <code>last</code>), <code>address</code>, and <code>dependents</code> (an array).', html:true,
   sub:qtbl(['TRN','First','Last','Address','Dependents'],[['10345','Kerry-Ann','Mills','8 Lady Musgrave Rd, Kgn 10','Jaden Mills, Zoe Mills'],['22871','Omari','Dunn','14 Hagley Park Rd, Kgn 11','Nia Dunn']]), start:'',
   target:[{TRN:10345,name:{first:'Kerry-Ann',last:'Mills'},address:'8 Lady Musgrave Rd, Kgn 10',dependents:['Jaden Mills','Zoe Mills']},{TRN:22871,name:{first:'Omari',last:'Dunn'},address:'14 Hagley Park Rd, Kgn 11',dependents:['Nia Dunn']}],
   hint:'[ { "TRN": 10345, "name": { "first": …, "last": … }, "address": …, "dependents": [ … ] }, { … } ]',
   why:'The composite Name becomes a nested object, and the multivalued Dependents becomes an array, even when there is only one dependent.'},
  {type:'json', q:'Represent this book in JSON. Keys: <code>title</code>, <code>author</code>, <code>published</code> (number), <code>genres</code> (array), <code>available</code> (boolean), and <code>section</code> (an object with <code>name</code>, <code>shelf</code> and <code>position</code> as a number).', html:true,
   sub:qtbl(['Title','Author','Published','Genres','Available','Library section'],[['The Lonely Londoners','Sam Selvon','1956','Classic, Fiction','Yes','Name: Literature<br>Shelf: L4<br>Position: 20']]), start:'',
   target:{title:'The Lonely Londoners',author:'Sam Selvon',published:1956,genres:['Classic','Fiction'],available:true,section:{name:'Literature',shelf:'L4',position:20}},
   hint:'"available": true, "genres": ["Classic", "Fiction"], "section": { "name": …, "shelf": …, "position": 20 }',
   why:'Yes becomes true, the list of genres becomes an array, and the library section, which has parts, becomes a nested object.'},
  {type:'json', q:'This list was grouped by department with <code>groupBy((emp) -> emp.dept)</code>. Write the grouped result: an object whose keys are the departments, in the order IT then HR, each holding an array of the employee objects.', html:true,
   sub:'<pre>[\n  {"name": "Kavi", "dept": "IT"},\n  {"name": "Rhea", "dept": "HR"},\n  {"name": "Devon", "dept": "IT"}\n]</pre>', start:'',
   target:{IT:[{name:'Kavi',dept:'IT'},{name:'Devon',dept:'IT'}],HR:[{name:'Rhea',dept:'HR'}]},
   hint:'{ "IT": [ {…Kavi…}, {…Devon…} ], "HR": [ {…Rhea…} ] }', why:'Grouping makes one key per department. Each key holds an array of the matching objects, kept in their original order.'},
  {type:'json', q:'Represent this course in JSON. Keys: <code>courseID</code>, <code>title</code>, <code>cost</code> (number), <code>hours</code> (number), <code>instructor</code> (an object with <code>id</code> and <code>name</code>), <code>deliveryModes</code> (array) and <code>award</code>.', html:true,
   sub:'“Course CMP2018, <i>Database Design</i>, costs J$38,000 and runs for 40 hours. It is taught by Avery Thompson (instructor ID I207) and offered Face-to-Face and Online. Students who complete it receive a Certificate of Completion.”', start:'',
   target:{courseID:'CMP2018',title:'Database Design',cost:38000,hours:40,instructor:{id:'I207',name:'Avery Thompson'},deliveryModes:['Face-to-Face','Online'],award:'Certificate of Completion'},
   hint:'"cost": 38000 (no J$ or comma), "deliveryModes": ["Face-to-Face", "Online"]', why:'Amounts are plain numbers. The two delivery modes are a multivalued fact, so they go in an array.'},
  {type:'mcq', q:'Given <code>p = {"name":{"first":"Kerry-Ann","last":"Mills"},"dependents":["Jaden Mills","Zoe Mills"]}</code>, what is <code>p.dependents[1]</code>?', html:true,
   opts:['"Jaden Mills"','"Zoe Mills"','"Mills"','undefined'], a:1, why:'Arrays start at 0, so [1] is the second dependent.'},
  {type:'mcq', q:'Best reason to choose JSON over XML for a mobile app’s API?', opts:['JSON supports comments','JSON is lighter and maps directly to JavaScript objects','JSON has stronger schema validation','JSON allows mixed text and tags'], a:1,
   why:'JSON is compact and parses natively in JS. XML is stronger for documents and strict schemas.'}
 ]},
{ id:'xml', name:'XML Cove', blurb:'Paper Q5 / Q6: write well-formed XML for a record, a passage of text, grouped data and a full document with its declaration.', unit:'Lecture 10',
 lessons:[
  ['Well-formed XML', `<ul><li>Start with the <b>XML declaration</b>: <code>&lt;?xml version="1.0" encoding="UTF-8"?&gt;</code></li>
   <li>Exactly <b>one root element</b> wraps everything.</li><li>Every opening tag has a closing tag (or is self-closing <code>&lt;br/&gt;</code>).</li>
   <li>Tags are <b>case-sensitive</b> and must nest properly, with no overlapping.</li><li>Attribute values go in quotes.</li></ul>
<pre>&lt;?xml version="1.0" encoding="UTF-8"?&gt;
&lt;course id="CMP2018"&gt;
  &lt;title&gt;Database Design&lt;/title&gt;
  &lt;hours&gt;40&lt;/hours&gt;
&lt;/course&gt;</pre>`],
  ['Elements, attributes and lists', `<p><b>Attributes</b> suit simple identifiers (<code>id="I207"</code>). <b>Elements</b> suit data that can repeat or has parts. Composite data becomes nested elements; a list becomes repeated child elements:</p>
<pre>&lt;genres&gt;
  &lt;genre&gt;Classic&lt;/genre&gt;

/* XML checkers: lenient about naming (elements or attributes, any case) but strict about the data */
const xlow=s=>String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' ');
const xnum=s=>xlow(s).replace(/^j\$|^\$|,/g,'');
function xEls(d,names){names=names.map(n=>n.toLowerCase());return [...d.getElementsByTagName('*')].filter(e=>names.includes(e.localName.toLowerCase()));}
function xVals(d,names){const out=[];names=names.map(n=>n.toLowerCase());
  [...d.getElementsByTagName('*')].forEach(e=>{if(names.includes(e.localName.toLowerCase())&&!e.children.length)out.push(e.textContent);
    [...e.attributes].forEach(a=>{if(names.includes(a.name.toLowerCase()))out.push(a.value);});});return out;}
function xHas(d,names,val,num){return xVals(d,names).some(v=>num?xnum(v)===xnum(val):xlow(v)===xlow(val));}
function xText(doc,sel){const e=doc.querySelector(sel);return e?e.textContent.trim():null;}
function xAllText(d){return xlow(d.documentElement.textContent+' '+[...d.getElementsByTagName('*')].flatMap(e=>[...e.attributes].map(a=>a.value)).join(' '));}
const XML_CHECKS={
  fix1(d){const r=d.documentElement; if(r.nodeName!=='workshop')return 'Keep <workshop> as the root.';
    if(xText(d,'workshop > title')!=='Data Modelling')return '<title> should still contain Data Modelling.';
    if(xText(d,'workshop > fee')!=='30000')return '<fee> should still contain 30000.'; return '';},
  verse(d){const t=xAllText(d);
    if(!/psalm/.test(t))return 'Include the book (Psalm or Psalms).';
    if(!xHas(d,['chapter'],'25',true))return 'Include the chapter, 25, in a chapter element or attribute.';
    const vs=xEls(d,['verse']); if(vs.length<2)return 'Use a separate <verse> element for each of the two verses.';
    const vt=xlow(vs.map(v=>v.textContent).join(' '));
    if(!vt.includes('shew me thy ways')||!vt.includes('lead me in thy truth'))return 'Each verse element should hold that verse’s text.';
    const nums=vs.flatMap(v=>[...v.attributes].map(a=>a.value).concat([...v.children].map(c=>c.textContent))).map(xnum);
    if(!nums.includes('4')||!nums.includes('5'))return 'Give each verse its number (4 and 5), as an attribute or a child element.'; return '';},
  book(d){const need=[[['title'],'The Lonely Londoners'],[['author'],'Sam Selvon'],[['published','year','publishedyear'],'1956',1],[['available'],null],[['name','sectionname'],'Literature'],[['shelf'],'L4'],[['position'],'20',1]];
    for(const [n,v,num] of need){if(v===null){const a=xVals(d,n).map(xlow);if(!a.some(x=>['yes','true'].includes(x)))return 'Include available as Yes or true.';continue;}
      if(!xHas(d,n,v,num))return `Include ${n[0]}: ${v}.`;}
    const g=xEls(d,['genre']).map(e=>xlow(e.textContent)); if(!(g.includes('classic')&&g.includes('fiction')))return 'Use a separate <genre> element for Classic and for Fiction.';
    if(!xEls(d,['section','librarysection','location']).length)return 'Nest the name, shelf and position inside a <section> element.'; return '';},
  group(d){const groupFor=dept=>[...d.getElementsByTagName('*')].filter(e=>e!==d.documentElement&&([...e.attributes].some(a=>xlow(a.value)===dept)||[...e.children].some(c=>!c.children.length&&xlow(c.textContent)===dept&&/name|dept|department/i.test(c.localName))||xlow(e.localName)===dept));
    const ok=(dept,inn,out)=>groupFor(dept).some(e=>{const t=xlow(e.textContent);return inn.every(n=>t.includes(n))&&out.every(n=>!t.includes(n));});
    if(!ok('it',['kavi','devon'],['rhea']))return 'Make an IT group element that contains Kavi and Devon (and not Rhea).';
    if(!ok('hr',['rhea'],['kavi','devon']))return 'Make an HR group element that contains Rhea only.'; return '';},
  course(d,src){if(!/^\s*<\?xml\s+version=/.test(src))return 'Start with the XML declaration: <?xml version="1.0" encoding="UTF-8"?>';
    const need=[[['courseid','id','code'],'CMP2018'],[['title','name','coursetitle'],'Database Design'],[['cost','price','fee'],'38000',1],[['hours','duration'],'40',1],[['name','instructorname','instructor'],'Avery Thompson'],[['id','instructorid'],'I207'],[['award','certificate'],'Certificate of Completion']];
    for(const [n,v,num] of need)if(!xHas(d,n,v,num))return `Include ${v} (as a ${n[0]} element or attribute).`;
    const t=xAllText(d); if(!xEls(d,['instructor']).length)return 'Group the instructor’s id and name inside an <instructor> element.';

    if(!modes.includes('face-to-face')||!modes.includes('online'))return 'Put Face-to-Face and Online in separate elements (for example two <mode> elements).'; return '';}
};

  if(/^[A-Z]/.test(k)&&k.length>1)k=(s>0&&!/\s|\($/.test(v[s-1])?' ':'')+k+' ';

function continueTarget(){
  if(!Object.keys(S.stars).length&&!S.last)return null;
  const lw=S.last&&worldById(S.last.w);
  if(lw){const c=lw.ch.slice(S.last.i).find(c=>!S.stars[c.id])||lw.ch.find(c=>!S.stars[c.id]);if(c)return {w:lw,c};}
  const started=WORLDS.filter(w=>doneCount(w)>0&&doneCount(w)<w.ch.length);
  for(const w of started.concat(WORLDS)){const c=w.ch.find(c=>!S.stars[c.id]);if(c)return {w,c};}
  return {done:true};
}

/* ---------- MARKING: the lecturer's margin ---------- */
const PRAISE=['Correct.','Correct.','Tidy.','Tidy.','Big up!','Clean work.','Clean work.','Wicked.',"That's the one.",'Mi rate dat.','Exactly right.','Exactly right.','Nuff respect.'];
const FULL=['Full marks.','Full marks.','Big up yourself, full marks.','Textbook.'];
const NUDGE=['Not quite.','Not quite.','Close, but no.',"Almost. One thing's off.",'Easy nuh, look again.','Try that once more.'];
function clearMarks(){['#mmark','#anno'].forEach(s=>{const e=$(s);if(e)e.innerHTML='';});document.querySelectorAll('.squig').forEach(e=>e.remove());}
function markMargin(ok,text,full){
  $('#mmark').innerHTML=ok
   ?`<svg class="draw" viewBox="0 0 28 28" fill="none" style="stroke:var(--tick)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15c3 2 5 5 6 8 4-9 9-15 15-20"/></svg>`
   :`<svg class="draw" viewBox="0 0 28 28" fill="none" style="stroke:var(--redpen)" stroke-width="2" stroke-linecap="round"><path d="M14 3C6 3 2 9 3 15s7 11 13 10 10-6 9-12S19 2 11 5"/><path d="M10 10l8 8M18 10l-8 8"/></svg>`;
  $('#anno').innerHTML=`<div class="anno ${ok?'':'bad'}">${esc(text)}${full?`<span class="uline draw"><svg viewBox="0 0 100 7" preserveAspectRatio="none" fill="none" style="stroke:var(--tick)" stroke-width="1.6" stroke-linecap="round"><path vector-effect="non-scaling-stroke" d="M2 2.5c30-1.5 60-1.5 96-.5"/><path vector-effect="non-scaling-stroke" d="M6 5.5c28-1.2 56-1 88 0"/></svg></span>`:''}</div>`;
}
function squiggle(){const t=$('#ed')||$('#zone');if(t)t.insertAdjacentHTML('afterend','<div class="squig" aria-hidden="true"></div>');}
function showNote(ok,body,stats){
  $('#note').innerHTML=`<section class="note ${ok?'':'bad'}" aria-label="Marker's note"><div class="label">${icon(ok?'check':'x')} Marker's note</div><div class="nb">${body}</div>${stats?`<div class="stats">${stats}</div>`:''}</section>`;
  const n=$('#note .note'); if(n&&n.scrollIntoView)n.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'});
}
function judge(ok,msg,extra=''){
  const c=CUR.c, ctx=CUR.ctx; clearMarks();
  if(ctx.mode==='boss'){ // one shot
    if(ok)ctx.score++;
    S.xp+=ok?15:2; save();
    (ctx.res||(ctx.res=[])).push({w:c.world,ok});
    CUR.state.locked=true;
    if(!ok&&c.type==='mcq'){const r=app.querySelector(`.opt[data-o="${c.a}"]`);if(r)r.classList.add('right');}
    markMargin(ok, ok?pick(PRAISE):'Not this time.');
    if(!ok)squiggle();
    showNote(ok,`${ok?'':esc(msg)+'<br><br>'}${c.why}${extra}`,`+${ok?15:2} XP · ${ctx.score} correct so far`);
    announce((ok?'Correct. ':'Incorrect. ')+stripTags((ok?'':msg+' ')+c.why));
    const last=ctx.i+1>=ctx.list.length;
    $('#hintBtn').hidden=true;
    setCheck(()=>{ctx.i++; last?bossEnd(ctx):play(ctx.list[ctx.i],ctx);}, last?'See your transcript →':'Next question →');
    return;
  }
  CUR.attempts++;
  if(ok){
    const st=Math.max(1,3-(CUR.attempts-1)-(CUR.hint?1:0)); const prev=S.stars[c.id]||0;
    const gain=prev?3:(st*10); S.xp+=gain; if(st>prev)S.stars[c.id]=st;
    S.streak=CUR.attempts===1?S.streak+1:0; save();
    const lvBefore=Math.floor((S.xp-gain)/100)+1; if(level()>lvBefore)setTimeout(()=>promo('Promoted to Year '+level()+'.'),400);
    const w=worldById(c.world); const nxt=w.ch[c.idx+1];
    markMargin(true, st===3?pick(FULL):pick(PRAISE), st===3);
    showNote(true, c.why+extra, `<span>+${gain} XP</span><span>·</span>${starStr(st)}${S.streak>1?`<span>·</span><span class="tally">${icon('flame')} streak ${S.streak}</span>`:''}`);
    const hs=$('#hdr .stars'); if(hs)hs.outerHTML=starStr(S.stars[c.id]||0);
    announce(`Correct. ${st} of 3 marks, plus ${gain} XP. ${stripTags(c.why)}`);
    $('#hintBtn').hidden=true;
    setCheck(()=>nxt?play(nxt,ctx):worldDone(w), nxt?'Next exercise →':'Collect your certificate →');
  } else {
    S.streak=0; save();
    const card=$('#qcard'); card.classList.remove('shake'); void card.offsetWidth; if(!reduced())card.classList.add('shake');
    const showWhy=CUR.attempts>=3;
    markMargin(false, pick(NUDGE)); squiggle();
    showNote(false, esc(msg)+(showWhy?`<br><br><b>Explanation:</b> ${c.why}`:''), CUR.attempts>1?`Attempt ${CUR.attempts}`:'');
    announce('Not quite. '+msg);
  }
}
function worldDone(w){
  const st=worldStars(w),mx=w.ch.length*3; screen('',w.ink);
  setHeader({back:home,kicker:w.hall,title:'Certificate'});
  const date=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  app.innerHTML=`<section class="card cert">${crest(76,true)}<div class="label">Certificate of completion</div>${art(w.id)}<h1>${w.hall}</h1><div class="muted">${esc(w.topic)}</div>
    <p class="aw">Awarded to a student of ${APP_NAME}</p>
    <div class="meta"><span class="label">${starStr(Math.round(st/mx*3))} ${st} / ${mx} marks</span><span class="label">${date}</span></div>
    <p class="muted" style="margin-top:10px">${st===mx?'A perfect record. You’re ready for this on the exam.':'Revisit any exercise with fewer than three marks to master it.'}</p>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn o" id="again">Revisit building</button><button class="btn" id="homeB">Back to campus</button></div></section>`;
  $('#homeB').onclick=home; $('#again').onclick=()=>worldScreen(w.id);
  announce(`Certificate of completion for ${w.hall}. ${st} of ${mx} marks.`);
}
function examCover(){
  screen('','var(--h-ink)'); setHeader({back:home,kicker:'Campus',title:'Examination Hall'});
  app.innerHTML=`<section class="card cover">${art('exam')}<div class="label">Examination paper</div><h1>Database Design</h1>
    <dl><dt>Questions</dt><dd>12</dd><dt>Coverage</dt><dd>All six halls, two each</dd><dt>Marking</dt><dd>Once per question</dd><dt>Best score</dt><dd>${S.bossBest} / 12</dd></dl>
    <p class="muted">Hints are allowed. The paper is graded A to F on a printed transcript.</p>
    <button class="btn" id="beginExam">Begin examination ${icon('arrow')}</button></section>`;
  $('#beginExam').onclick=startBoss;
}
function startBoss(){
  const pool=ALL.slice().sort(()=>Math.random()-.5);
  const list=[]; WORLDS.forEach(w=>{const p=pool.filter(c=>c.world===w.id);list.push(p[0],p[1]);});
  list.sort(()=>Math.random()-.5);
  play(list[0],{mode:'boss',list,i:0,score:0,res:[],t0:Date.now()});
}
const GRADE_NOTE={A:'Exam-ready. Big up!',B:'Strong paper.',C:'Solid pass. Revisit the weaker halls.',D:'Not there yet. The notes will get you there.',F:'Rough paper. Start with the lecture notes and come back.'};
function bossEnd(ctx){
  const sc=ctx.score; if(sc>S.bossBest)S.bossBest=sc; S.xp+=sc*5; save();
  const grade=sc>=11?'A':sc>=9?'B':sc>=7?'C':sc>=5?'D':'F', time=elapsed(ctx);
  screen('','var(--h-ink)'); setHeader({back:home,kicker:'Examination Hall',title:'Transcript'});
  const rows=WORLDS.map(w=>{const r=(ctx.res||[]).filter(x=>x.w===w.id);return `<tr><td>${w.hall}</td><td>${r.filter(x=>x.ok).length} / ${r.length}</td></tr>`;}).join('');
  app.innerHTML=`<section class="card cover"><div class="label">Transcript · ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div>
    <div class="grade" role="img" aria-label="Grade ${grade}"><b>${grade}</b><small>GRADE</small></div>
    <h2>${sc} / ${ctx.list.length} correct</h2><p class="muted">${GRADE_NOTE[grade]}</p>
    <div class="tbl transcript"><table><tr><th>Building</th><th>Correct</th></tr>${rows}<tr><td><b>Total</b></td><td><b>${sc} / ${ctx.list.length}</b></td></tr></table></div>
    <p class="label" style="margin-top:14px">Best ${S.bossBest} / 12 · +${sc*5} bonus XP · ${time}</p>
    <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="again">Sit again</button><button class="btn o" id="homeB">Back to campus</button></div></section>`;
  $('#homeB').onclick=home; $('#again').onclick=examCover;
  announce(`Grade ${grade}. ${sc} of ${ctx.list.length} correct.`);
}

/* ---------- THE WORKSHOP (sandbox) ---------- */
let SANDDB=null, SANDCOLL=null;
function sandbox(tab){
  screen('','var(--h-ink)'); setHeader({back:home,kicker:'Campus',title:'The Workshop'});
  app.innerHTML=`<p class="muted" style="margin:0 0 12px">Free practice. Nothing is graded.</p><div class="tabs" role="tablist">${['sql','ra','mongo','json','xml'].map(t=>`<button role="tab" aria-selected="${t===tab}" data-t="${t}" class="${t===tab?'on':''}">${t==='ra'?'ALGEBRA':t.toUpperCase()}</button>`).join('')}</div>
   <div class="card" id="sb"></div>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>sandbox(b.dataset.t));
  const sb=$('#sb');
  if(tab==='sql'){
    sb.innerHTML=`<div class="muted" style="font-size:14px">Tables: ${Object.values(CASES).flat().join(', ')}. Your changes stay until you reset. You can run several statements at once.</div>
    <textarea class="ed" id="sed" ${edAttrs} aria-label="SQL editor" style="min-height:160px">SELECT d.deptName, COUNT(*) AS staff, SUM(e.salary) AS salaryBill
FROM department d JOIN employee e ON d.deptID = e.deptID
GROUP BY d.deptName
ORDER BY d.deptName;</textarea>${keyBar('sql','sed')}
    <div class="row" style="margin-top:8px"><button class="btn sm" id="srun">${icon('play')} Run</button><button class="btn o sm" id="sreset">${icon('reset')} Reset DB</button><button class="btn o sm" id="sschema">${icon('table')} Schema</button></div><div class="out" id="sout" aria-live="polite"></div>`;
    const out=$('#sout');
    const ensure=fn=>sqlReady.then(()=>{if(sqlErr){out.innerHTML=ERR(`SQL engine failed to start: ${esc(sqlErr.message)}`);return;}if(!SANDDB)SANDDB=freshDB();fn();});
    $('#srun').onclick=()=>ensure(()=>{try{const res=SANDDB.exec($('#sed').value);out.innerHTML=res.length?res.map(r=>tableHTML(r)).join(''):OK(`Done. ${SANDDB.getRowsModified()} row(s) changed.`);}catch(e){out.innerHTML=ERR(esc(e.message));}});
    $('#sreset').onclick=()=>ensure(()=>{SANDDB.close();SANDDB=freshDB();out.innerHTML=OK('Database reset to the original data.');});
    $('#sschema').onclick=()=>ensure(()=>{out.innerHTML=tableHTML(SANDDB.exec("SELECT name, sql FROM sqlite_master WHERE type='table'")[0]);});
  } else if(tab==='ra'){
    sb.innerHTML=`<div class="muted" style="font-size:14px">Relational algebra on the same tables (${Object.values(CASES).flat().join(', ')}). Use one line per assignment (Name ← expression); the last line is the answer.</div>
    <textarea class="ed" id="sed" ${edAttrs} aria-label="Relational algebra editor" style="min-height:140px">π venueName (Venue) − π venueName (Venue ⋈ Workshop)</textarea>${keyBar('ra','sed')}
    <div class="row" style="margin-top:8px"><button class="btn sm" id="srun">${icon('play')} Run</button></div><div class="out" id="sout" aria-live="polite"></div>`;
    const out=$('#sout');
    $('#srun').onclick=()=>sqlReady.then(()=>{if(sqlErr){out.innerHTML=ERR(`The engine failed to start: ${esc(sqlErr.message)}`);return;}const db=freshDB();try{out.innerHTML=tableHTML(raRun(db,$('#sed').value));}catch(e){out.innerHTML=ERR(esc(e.message));}finally{db.close();}});
  } else if(tab==='mongo'){
    if(!SANDCOLL)SANDCOLL={students:clone(MONGO_STUDENTS)};
    sb.innerHTML=`<div class="muted" style="font-size:14px">Collection: db.students. Supports find, findOne, countDocuments, insertOne/Many, updateOne/Many, deleteOne/Many, sort, limit and skip.</div>
    <textarea class="ed" id="sed" ${edAttrs} aria-label="Mongo shell editor">db.students.find({ gpa: { $gte: 3.5 } }, { name: 1, gpa: 1, _id: 0 }).sort({ gpa: -1 })</textarea>${keyBar('mongo','sed')}
    <div class="row" style="margin-top:8px"><button class="btn sm" id="srun">${icon('play')} Run</button><button class="btn o sm" id="sreset">${icon('reset')} Reset</button></div><div class="out" id="sout" aria-live="polite"></div>`;
    $('#srun').onclick=()=>{try{$('#sout').innerHTML=mongoHTML(runMongo($('#sed').value,SANDCOLL));}catch(e){$('#sout').innerHTML=ERR(esc(e.message));}};
    $('#sreset').onclick=()=>{SANDCOLL={students:clone(MONGO_STUDENTS)};$('#sout').innerHTML=OK('Collection reset.');};
  } else if(tab==='json'){
    sb.innerHTML=`<textarea class="ed" id="sed" ${edAttrs} aria-label="JSON editor" style="min-height:180px">{
  "code": "CMP2018",
  "title": "Database Design",
  "credits": 3,
  "deliveryModes": ["Face-to-Face", "Online"]
}</textarea>${keyBar('json','sed')}<div class="row" style="margin-top:8px"><button class="btn sm" id="srun">${icon('search')} Validate &amp; format</button><button class="btn o sm" id="sxml">${icon('convert')} Convert to XML</button></div><div class="out" id="sout" aria-live="polite"></div>`;
    $('#srun').onclick=()=>{try{$('#sout').innerHTML=`${OK('Valid JSON')}<pre>${esc(JSON.stringify(JSON.parse($('#sed').value),null,2))}</pre>`;}catch(e){$('#sout').innerHTML=ERR(esc(e.message));}};
    $('#sxml').onclick=()=>{try{const v=JSON.parse($('#sed').value);$('#sout').innerHTML=`<div class="lbl">As XML</div><pre>${esc(toXML(v,'root',''))}</pre>`;}catch(e){$('#sout').innerHTML=ERR(esc(e.message));}};
  } else {
    sb.innerHTML=`<textarea class="ed" id="sed" ${edAttrs} aria-label="XML editor" style="min-height:180px">&lt;?xml version="1.0"?&gt;
&lt;course code="CMP2018"&gt;
  &lt;title&gt;Database Design&lt;/title&gt;
  &lt;credits&gt;3&lt;/credits&gt;
&lt;/course&gt;</textarea>${keyBar('xml','sed')}<div class="row" style="margin-top:8px"><button class="btn sm" id="srun">${icon('search')} Check well-formed</button><button class="btn o sm" id="sjson">${icon('convert')} Convert to JSON</button></div><div class="out" id="sout" aria-live="polite"></div>`;
    const parse=()=>{const d=new DOMParser().parseFromString($('#sed').value.trim(),'application/xml');const pe=d.getElementsByTagName('parsererror')[0];if(pe)throw new Error(pe.textContent.replace(/Below is a rendering.*$/s,'').trim().slice(0,240));return d;};
    $('#srun').onclick=()=>{try{parse();$('#sout').innerHTML=OK('Well-formed XML');}catch(e){$('#sout').innerHTML=ERR(esc(e.message));}};
    $('#sjson').onclick=()=>{try{const d=parse();const r=d.documentElement;$('#sout').innerHTML=`<div class="lbl">As JSON</div><pre>${esc(JSON.stringify({[r.nodeName]:fromXML(r)},null,2))}</pre>`;}catch(e){$('#sout').innerHTML=ERR(esc(e.message));}};
  }
}
function toXML(v,tag,ind){const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  if(Array.isArray(v))return v.map(e=>toXML(e,tag.replace(/s$/,'')||'item',ind)).join('\n');
  if(v&&typeof v==='object')return `${ind}<${tag}>\n${Object.entries(v).map(([k,e])=>Array.isArray(e)?`${ind}  <${k}>\n${toXML(e,k,ind+'    ')}\n${ind}  </${k}>`:toXML(e,k,ind+'  ')).join('\n')}\n${ind}</${tag}>`;
  return `${ind}<${tag}>${x(v)}</${tag}>`;}
function fromXML(el){const kids=[...el.children];const o={};[...el.attributes].forEach(a=>o['@'+a.name]=a.value);
  if(!kids.length){const t=el.textContent.trim();return Object.keys(o).length?Object.assign(o,{'#text':t}):(t!==''&&!isNaN(t)?+t:t);}
  kids.forEach(k=>{const v=fromXML(k);if(o[k.nodeName]!==undefined){if(!Array.isArray(o[k.nodeName]))o[k.nodeName]=[o[k.nodeName]];o[k.nodeName].push(v);}else o[k.nodeName]=v;});return o;}

/* ---------- keyboard shortcuts (desktop) ---------- */
function showKeys(){if($('.kbd'))return;
  document.body.insertAdjacentHTML('beforeend',`<div class="kbd" role="dialog" aria-modal="true" aria-labelledby="kbdT"><div class="card"><div class="row" style="justify-content:space-between"><h2 id="kbdT" style="font-size:18px">Keyboard shortcuts</h2><button class="hbtn" id="kbdX" aria-label="Close">${icon('x')}</button></div>
    <dl><dt>Ctrl/⌘ + Enter</dt><dd>Run the query</dd><dt>1 – 4</dt><dd>Pick an option</dd><dt>Enter</dt><dd>Check your answer</dd><dt>H</dt><dd>Show a hint</dd><dt>Esc</dt><dd>Go back</dd><dt>?</dt><dd>This list</dd></dl></div></div>`);
  const k=$('.kbd');$('#kbdX').onclick=()=>k.remove();k.onclick=e=>{if(e.target===k)k.remove();};$('#kbdX').focus();}
document.addEventListener('keydown',e=>{
  const t=e.target, typing=t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT');
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){const r=$('#run')||$('#srun');if(r){e.preventDefault();r.click();}return;}
  if(e.key==='Escape'){const k=$('.kbd');if(k){k.remove();return;}if(typing){t.blur();return;}if(BACK){e.preventDefault();BACK();}return;}
  if(e.key==='Enter'&&t&&t.classList&&t.classList.contains('opt')&&t.classList.contains('sel')){const b=$('#checkBtn');if(b){e.preventDefault();b.click();}return;}
  if(typing||e.ctrlKey||e.metaKey||e.altKey||$('.kbd'))return;
  if(e.key==='?'){showKeys();return;}
  if(!$('#qcard'))return;
  if(/^[1-6]$/.test(e.key)){const o=app.querySelectorAll('.opt')[+e.key-1];if(o){o.click();o.focus();}return;}
  if(e.key==='h'||e.key==='H'){const h=$('#hintBtn');if(h&&!h.hidden)h.click();return;}
  if(e.key==='Enter'&&!(t&&(t.tagName==='BUTTON'||t.tagName==='A'))){const b=$('#checkBtn');if(b){e.preventDefault();b.click();}}
});

applyTheme();
home();
if(CONTENT_NOTE){toast(CONTENT_NOTE,6500);announce(CONTENT_NOTE);}
</script>
